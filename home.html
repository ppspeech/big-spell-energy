  const left=ws.filter(x=>!G2.calls.includes(x.w)&&!G2.marked.has(G2.tiles.indexOf(key(x))));
  const pool=left.length?left:ws; const x=pool[Math.floor(Math.random()*pool.length)]; G2.call=x; G2.calls.push(x.w); G2.fb=null; setTimeout(()=>gmSay(x.w),250); }
function g2Line(m){ const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return L.some(l=>l.every(i=>m.has(i))); }

/* ---- tic-tac-toe ---- */
function g2TttInit(){ const s=G2.set; const ws=gmShuffle(g2Words(s));
  const vow=["a","e","i","o","u"];
  G2.cells=ws.slice(0,9).map(x=>{ let k=s.code==="ec"?x.parts.findIndex(p=>p===x.sp||p.replace(/[-_]/,"")===String(x.sp).replace(/[-_]/,"")):x.parts.findIndex(p=>vow.includes(p)); if(k<0) k=x.parts.findIndex(p=>/[aeiouy]/.test(p)); if(k<0) k=0;
    const ans=x.parts[k]; const pool=s.code==="ec"?s.sp.filter(z=>z!==ans&&!/[-_]/.test(z)):vow.filter(v=>v!==ans); const opts=gmShuffle([ans,...gmShuffle(pool).slice(0,2)]);
    return {w:x.w,pre:x.parts.slice(0,k).join(""),post:x.parts.slice(k+1).join(""),ans,opts,owner:null}; });
  G2.turn="X"; G2.sel=null; G2.win=null; }
function g2TttWin(){ const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; for(const l of L){ const o=G2.cells[l[0]].owner; if(o&&l.every(i=>G2.cells[i].owner===o)) return o; } return G2.cells.every(c=>c.owner)?"draw":null; }
function g2Ttt(){ const s=G2.sel!==null?G2.cells[G2.sel]:null;

   <div class="g2ttt">${G2.cells.map((x,i)=>`<button class="${x.owner?"own "+x.owner:""} ${G2.sel===i?"sel":""}" data-g2="tsel" data-v="${i}" ${x.owner||G2.win?"disabled":""}>${x.owner?`<span class="mk">${x.owner==="X"?"❌":"⭕"}</span>`:""}<span class="tw">${x.owner?esc(x.w):`${esc(x.pre)}<u></u>${esc(x.post)}`}</span></button>`).join("")}</div>

/* ---- actions ---- */
function g2Act(a,v){ const s=G2;
  if(a==="again"){ openG2(s.c,s.uid,s.game); return; }
  if(a==="lpick"){ s.pick=Number(v); s.fb=null; }
  if(a==="lset"){ const t=s.chain[s.i]; const w=s.cur.split(""); w[s.pick]=v; const nw=w.join("");
    if(nw===t){ s.items.push({w:t,r:s.miss?"x":"a"}); s.cur=t; s.i++; s.pick=null; s.miss=false; s.fb={ok:true,t:`Yes! <b>${esc(t)}</b>`}; if(s.i<s.chain.length) setTimeout(()=>{ if(G2===s){ s.fb=null; g2Draw(); gmSay(s.chain[s.i]); } },900); else gmSay("Top of the ladder!"); }
    else { s.miss=true; s.pick=null; s.fb={ok:false,t:`That makes <b>${esc(nw)}</b>. Listen again and find the sound that changed.`}; gmSay(t); } }
  if(a==="bmark"){ const i=Number(v); const t=s.tiles[i]; const ok=s.mode==="spelling"?t===s.call.sp:t===s.call.parts[0];
    if(ok){ s.marked.add(i); s.items.push({w:s.call.w,r:"a"}); if(g2Line(s.marked)){ s.bingo=true; gmSay("Bingo!"); } else { s.fb={ok:true,t:"Yes!"}; g2Draw(); setTimeout(()=>{ if(G2===s&&!s.bingo){ g2BingoCall(); g2Draw(); } },700); return; } }
    else { s.items.push({w:s.call.w,r:"x",ch:t}); s.fb={ok:false,t:`Not that one. Listen again: ${esc(s.call.w)}.`}; gmSay(s.call.w); } }
  if(a==="hit"||a==="out"){ const x=s.deck[s.i]; s.items.push({w:x.w,r:a==="hit"?"a":"x"});
    if(a==="hit"){ let runs=0; const b=[...s.bases]; for(let k=2;k>=0;k--) if(b[k]){ if(k+x.h>=3) runs++; else b[k+x.h]=1; b[k]=0; } if(x.h>=4) runs++; else b[x.h-1]=1; s.bases=b; s.runs+=runs; s.fb=runs?`${runs} run${runs>1?"s":""} scored!`:["","Single!","Double!","Triple!"][x.h]; }
    else { s.outs++; s.fb=null; if(s.outs>=3){ s.outs=0; s.bases=[0,0,0]; s.fb="Three outs. New inning!"; } }
    s.i++; }
  if(a==="roll"){ g2Roll(); }
  if(a==="sread"){ s.items.push({w:s.word.join(""),r:v}); s.stage="judge"; }
  if(a==="sjudge"){ const w=s.word.join(""); const real=G2_REAL.has(w); const ok=(v==="r")===real; s.fb={ok,t:`${ok?"Yes! ":"Not quite. "}<b>${esc(w)}</b> is ${real?"a real word":"a made-up word"}.`}; s.stage="fb"; s.n++; }
  if(a==="tsel"){ s.sel=Number(v); s.fb=null; gmSay(s.cells[s.sel].w); }
  if(a==="tans"){ const x=s.cells[s.sel]; const ok=v===x.ans; s.items.push({w:x.w,r:ok?"a":"x",ch:ok?null:v});
    if(ok){ x.owner=s.turn; s.fb={ok:true,t:`Yes! <b>${esc(x.w)}</b>`}; } else s.fb={ok:false,t:`Not quite. It's <b>${esc(x.w)}</b>. Turn over!`};
    s.sel=null; s.win=g2TttWin(); if(!s.win) s.turn=s.turn==="X"?"O":"X"; }
  if(a==="yread"){ const [w]=s.deck[s.i%s.deck.length]; s.items.push({w,r:v}); if(v==="a") s.stage="count"; else { s.fb={ok:false,t:"No move this time."}; s.stage="fb"; s.tedTurn=true; } }
  if(a==="ycount"){ const [w,n]=s.deck[s.i%s.deck.length]; const k=Number(v); s.me=Math.min(s.N,s.me+n); s.fb={ok:k===n,t:`${k===n?"Yes! ":""}<b>${esc(w)}</b> has ${n} syllable${n>1?"s":""}. Move ${n}!`}; s.stage="fb"; s.tedTurn=true; }
  if(a==="ynext"){ if(s.tedTurn&&s.me<s.N){ s.ted=Math.min(s.N,s.ted+1+Math.floor(Math.random()*2)); } s.tedTurn=false; s.i++; s.stage="read"; s.fb=null; }
  g2Draw(); }

function swSpotInit(){ const S=SWA; const ks=spotKeys(S.uid); S.keys=ks; S.sk=S.sk&&ks.includes(S.sk)?S.sk:ks[Math.floor(Math.random()*ks.length)]; const st=SPOT_STORIES[S.sk];

  const order=(gmSetFor(S.uid)||{}).sp||[]; const used=[...new Set(Object.values(st.targets))]; S.cols=order.filter(x=>used.includes(x)).concat(used.filter(x=>!order.includes(x)));

      const over=o.querySelector("[data-col].over"); o.querySelectorAll("[data-col]").forEach(c=>c.classList.remove("over"));

const _spAct=swAct;

function gmPairsInit(set){
  GM.title="Pairs";
  if(!GM.pairsMode){ GM.st={}; GM.view=()=>`<p class="gm-msg">How many players?</p><div class="g3who"><button class="gm-card" data-pm="1"><span class="gm-ic">🙋</span><b>Just me</b><small>Find all the pairs</small></button><button class="gm-card" data-pm="2"><span class="gm-ic">👫</span><b>2 players</b><small>Take turns. Most pairs wins!</small></button></div>`;
    GM.bind=r=>r.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{ GM.pairsMode=Number(b.dataset.pm); gmPairsInit(set); gmRender(); }); return; }
  const two=GM.pairsMode===2;
  const words=gmShuffle(set.words).slice(0,6).map(x=>gmPlain(x.w));
  GM.st={cards:gmShuffle(words.concat(words)).map(w=>({w,up:false,won:false,by:null})), pick:[], flips:0, t0:Date.now(), done:false, lock:false, turn:0, sc:[0,0], two};
  const P=k=>k===0?`${avatarSVG(avOf(GM.c),28,GM.c.code)}<b>${esc(GM.c.code)}</b>`:`<span class="g3tok">🦊</span><b>Player 2</b>`;
  GM.view=()=>{ const s=GM.st;
    if(s.done) return two?gmDone(s.sc[0]===s.sc[1]?"It's a draw! 🤝":`${s.sc[0]>s.sc[1]?esc(GM.c.code):"Player 2"} wins! 🏆`, `${esc(GM.c.code)} ${s.sc[0]} · Player 2 ${s.sc[1]}`):gmDone(gmCheer(), `All 6 pairs in ${s.flips} turns.`);
    const last=s.pick.length===2&&s.cards[s.pick[0]].w===s.cards[s.pick[1]].w;
    return `${two?`<div class="g3score">${[0,1].map(k=>`<div class="g3p ${s.turn===k?"on":""}">${P(k)}<span class="g3n">${s.sc[k]}</span></div>`).join("")}</div>`:""}
      <p class="gm-msg">${last?`A pair! Say the sounds and read it: <b>${esc(s.cards[s.pick[0]].w)}</b>${two?" · go again!":""}`:two?`<b>${s.turn===0?esc(GM.c.code):"Player 2"}</b>, turn over two cards. Read each one.`:"Turn over two cards. Read each one."}</p>
      <div class="gm-pairs">${s.cards.map((cd,k)=>`<button class="gm-pc ${cd.up||cd.won?"up":""} ${cd.won?"won p"+cd.by:""}" data-pc="${k}" ${cd.won?"disabled":""}>${cd.up||cd.won?esc(cd.w):"?"}</button>`).join("")}</div>
      <div class="gm-act"><button class="g3link" data-pm="x">${two?"Switch to 1 player":"Switch to 2 players"}</button></div>`; };
  GM.bind=r=>{ const s=GM.st;
    r.querySelectorAll("[data-a=again]").forEach(b=>b.onclick=()=>gmStart("pairs"));
    r.querySelectorAll("[data-pm=x]").forEach(b=>b.onclick=()=>{ GM.pairsMode=two?1:2; gmPairsInit(set); gmRender(); });
    r.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{
      if(s.lock) return; const k=Number(b.dataset.pc); const cd=s.cards[k]; if(cd.up||cd.won) return;
      if(s.pick.length===2){ s.pick.forEach(i=>{ if(!s.cards[i].won) s.cards[i].up=false; }); s.pick=[]; }
      cd.up=true; s.pick.push(k); gmSay(cd.w);
      if(s.pick.length===2){ s.flips++; const [a,c2]=s.pick.map(i=>s.cards[i]);
        if(a.w===c2.w){ a.won=c2.won=true; a.by=c2.by=s.turn; s.sc[s.turn]++;
          if(s.cards.every(x=>x.won)){ setTimeout(()=>{ s.done=true; gmSave("pairs", 6, s.flips, Date.now()-s.t0, [...new Set(s.cards.map(x=>x.w))].map(w=>({w,r:"a"}))); gmRender(); },1200); } }
        else { s.lock=true; setTimeout(()=>{ s.lock=false; s.pick.forEach(i=>s.cards[i].up=false); s.pick=[]; if(two) s.turn=1-s.turn; gmRender(); },1300); } }
      gmRender(); }); };

const kgBoing=()=>kgTone([300,420],"triangle",.18,.14);
function kgShuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function kgDone(c){ try{ return (typeof gameruns!=="undefined"?gameruns:[]).filter(g=>g.clientId===c.id&&(g.game==="kg"||g.game==="balloon")).map(g=>(g.game==="balloon"?"balloon":g.skin)+"|"+g.si); }catch(e){ return []; } }

/* ---------- picker ---------- */
function kgBreak(n){ const sp=[...n].map((ch,i)=>ch===" "?i:-1).filter(i=>i>=0); if(!sp.length) return esc(n); const m=sp.reduce((a,b)=>Math.abs(b-n.length/2)<Math.abs(a-n.length/2)?b:a); return esc(n.slice(0,m))+"<br>"+esc(n.slice(m+1)); }
function kgOpen(c,si){ kgFont(); if(typeof wkClose==="function") wkClose(); try{ WK={c,kind:"kg"}; }catch(e){}
  if(si==null){ try{ si=typeof rcStartSec==="function"?rcStartSec(c):0; }catch(e){ si=0; } }
  KG={c,si,skin:null};
  const o=document.createElement("div"); o.id="wkov"; o.className="wkov kgov"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true");
  document.body.appendChild(o); document.body.style.overflow="hidden"; if(typeof wkKey==="function") document.addEventListener("keydown",wkKey); kgDraw(); }

/* ---------- game state ---------- */
function kgStart(skin){ if(skin==="balloon"){ const c=KG.c, si=KG.si; kgClose(); bpOpen(c,si); if(BP) BP.kg=true; return; }
  const S=RC_SECS[KG.si];
  const items=kgShuf(S.real).map(w=>({w,t:"r"})).concat(kgShuf(S.silly).map(w=>({w,t:"s"}))).concat([{w:S.sent,t:"x"}]);
  Object.assign(KG,{skin,items,i:0,card:false,got:[],stars:0,t0:Date.now(),fx:null,st:{}});
  (KG_SK[skin].init||(()=>{}))(KG.st); kgDraw(); }
const kgCur=()=>KG.items[KG.i];
const kgPhase=()=>{ const t=(kgCur()||{}).t; return t==="r"?"real":t==="s"?"silly":"sent"; };

function kgRead(){ if(!KG.card) return; const it=kgCur(); KG.got.push(it.w); KG.stars+=it.t==="x"?3:1; KG.card=false; kgChime();

  const fin=KG.i>=KG.items.length;
  if(sk.after) sk.after(KG.st,it,fin);
  if(!fin&&kgPhase()!==prevPhase){ KG.fx=kgPhase()==="silly"?"👽 Alien words!":"⭐ Last one: the sentence!"; setTimeout(()=>{ if(KG){ KG.fx=null; kgDraw(); } },1500); }
  kgDraw();

  try{ if(typeof canWrite==="undefined"||canWrite) await db.collection("games").doc().set({clientId:KG.c.id,date:today(),game:"kg",skin:KG.skin,si:KG.si,set:S.id,label:`${n} · Level ${KG.si+1} · ${S.name}`,correct:KG.got.length,total:KG.got.length,ms:Date.now()-KG.t0,items:KG.got.map(w=>({w,r:"a"})),createdAt:Date.now()}); }catch(e){} }

  if(a==="tap"){ if(KG.card||KG.win||KG.i>=KG.items.length) return; const sk=KG_SK[KG.skin]; if(sk.tap) sk.tap(KG.st,v,el); else kgReveal(); return; } }

/* ---------- backward decoding ---------- */
function wkBackSteps(word){
  const w=(word||"").toLowerCase().replace(/[^a-z]/g,""); if(!w) return [];
  const CU=["sh","ch","th","ph","wh","ck","ng","qu"];
  const u=[]; for(let i=0;i<w.length;){ const d=CU.find(x=>w.startsWith(x,i)); if(d&&d!=="qu"){ u.push({t:d,v:false}); i+=d.length; continue; }
    if(w.startsWith("qu",i)){ u.push({t:"qu",v:false}); i+=2; continue; }
    const ch=w[i]; const v="aeiou".includes(ch)||(ch==="y"&&i>0); u.push({t:ch,v}); i++; }
  const L=u.length; if(L>2&&u[L-1].t==="e"&&!u[L-2].v&&u.slice(0,L-2).some(x=>x.v)) u[L-1].v=false;
  const g=[]; u.forEach(x=>{ const last=g[g.length-1]; if(last&&last.v&&x.v) last.t+=x.t; else g.push({...x}); });
  const vi=g.map((x,i)=>x.v?i:-1).filter(i=>i>=0); if(!vi.length) return [w];
  const str=(a,b)=>g.slice(a,b).map(x=>x.t).join("");
  const steps=[]; let start=vi[vi.length-1]; steps.push(str(start,g.length));
  for(let k=vi.length-1;k>0;k--){ const prevV=vi[k-1]; const cons=start-prevV-1;
    if(cons>0){ start=start-1; steps.push(str(start,g.length)); }
    start=prevV; steps.push(str(start,g.length)); }
  if(start>0) steps.push(w);
  return steps.filter((s,i)=>i===0||s!==steps[i-1]);
}
function wkBackWords(c){ const base=["fantastic","carpenter","sandwich","basket","picnic","remember","important","trumpet","dinosaur","computer","hospital","adventure"];
  const o=okState(c); const ps=o&&o.L.units.find(u=>u.id==="ps2"); return base; }
function wkBack(){ const st=wkBackSteps(WK.w); const cur=st[Math.min(WK.step,st.length-1)]||"";
  const hid=WK.w.length-cur.length;
  return `<div class="wkkid"><div class="wkbig wkback"><span class="h">${esc(WK.w.slice(0,hid))}</span>${esc(WK.w.slice(hid))}</div>
    <div class="wksteps">${st.map((s,i)=>`<span class="${i===WK.step?"on":i<WK.step?"done":""}">${esc(s)}</span>`).join("<i>→</i>")}</div>
    <div class="wknav"><button data-wa="bprev" ${WK.step?"":"disabled"}>‹ Back</button><button class="go" data-wa="bnext">${WK.step>=st.length-1?"New word":"Next"}</button></div>

  const done=WK.k>=words.length; const cur=done?-1:order[WK.k];
  return `<div class="wkkid"><div class="wkseg">${[["back","Last word first"],["mix","Mixed order"]].map(([k,l])=>`<button class="${WK.mode===k?"on":""}" data-wa="rmode" data-v="${k}">${l}</button>`).join("")}</div>

function wkAct(a,v,el){
  const S=WK.inv;
  if(a==="qpick"){ WK.q.pick=Number(v); WK.score[1]++; if(WK.q.pick===WK.q.i) WK.score[0]++; }
  if(a==="qnext") WK.q=wkQuizItem();
  if(a==="band"){ WK.inv={band:v,items:gmShuffle(WK_INV[v][1]).slice(0,6).map(([w,p])=>({w,p:p.split(" "),s:p.split(" ").map(()=>true),ch:""})),i:0,t0:Date.now()}; }
  if(a==="snd"){ const x=S.items[S.i]; x.s[v]=!x.s[v]; }
  if(a==="inext"){ if(S.i<S.items.length-1) S.i++; else S.done=true; }
  if(a==="iprev"&&S.i) S.i--;
  if(a==="isave"){ wkSaveInv(); return; }
  if(a==="bnext"){ const st=wkBackSteps(WK.w); if(WK.step<st.length-1) WK.step++; else { const i=WK.words.indexOf(WK.w); WK.w=WK.words[(i+1)%WK.words.length]; WK.step=0; } }
  if(a==="bprev"&&WK.step) WK.step--;
  if(a==="bword"){ WK.w=v; WK.step=0; }
  if(a==="btype"){ const w=v.trim().toLowerCase().replace(/[^a-z]/g,""); if(!w) return; if(!WK.words.includes(w)) WK.words.unshift(w); WK.w=w; WK.step=0; }
  if(a==="rmode"){ WK.mode=v; WK.k=0; WK.ord=null; }
  if(a==="rnext"){ const n=(WK.cust||WK_SENT[WK.s]).split(/\s+/).length; if(WK.k<n) WK.k++; else { WK.cust=null; WK.s=(WK.s+1)%WK_SENT.length; WK.k=0; WK.ord=null; } }
  if(a==="rprev"&&WK.k) WK.k--;
  if(a==="rtype"){ const s=v.trim(); if(!s) return; WK.cust=s; WK.k=0; WK.ord=null; }
  if(a==="lmode") WK.mode=v;
  if(a==="lsrc"){ WK.src=v; WK.words=wkLookWords(WK.c,v); }
  if(a==="ltype"){ const ws=v.split(/[\s,]+/).filter(Boolean).slice(0,10); if(!ws.length) return; WK.words=ws; WK.src="own"; }
  if(a==="sgplay"||a==="sgrole"){ WK.sg={mode:a==="sgplay"?"play":"role",deck:gmShuffle(stCards().map((_,i)=>i)),i:0,pos:0}; }
  if(a==="sgedit"){ WK.sg={mode:"edit"}; WK.sgEd={steps:stSteps().slice(),cards:stCards().map(c=>c.slice())}; }
  if(a==="sgadds") WK.sgEd.steps.push("");
  if(a==="sgdels") WK.sgEd.steps.splice(Number(v),1);
  if(a==="sgaddc") WK.sgEd.cards.push(["","","",""]);
  if(a==="sgdelc"){ if(!confirm("Delete this card?")) return; WK.sgEd.cards.splice(Number(v),1); }
  if(a==="sgreset"){ if(!confirm("Go back to the original steps and cards? Your edits will be lost.")) return; WK.sgEd={steps:STUCK_STEPS.slice(),cards:WK_STUCK.map(c=>c.slice())}; }
  if(a==="sgsave"){ const E=WK.sgEd; const cards=E.cards.map(c=>c.map(x=>(x||"").trim())).filter(c=>c[0]||c[1]||c[3]); const steps=E.steps.map(x=>(x||"").trim()).filter(Boolean);
    if(cards.some(c=>!c[1]||!c[2]||!c[3])){ toast("Each card needs the child part, the 'instead of' and the 'try' reply."); return; }
    const same=JSON.stringify(cards)===JSON.stringify(WK_STUCK)&&JSON.stringify(steps)===JSON.stringify(STUCK_STEPS);
    settings.stuck=same?null:{steps,cards:cards.map(c=>({t:c[0],kid:c[1],no:c[2],yes:c[3]}))};
    (async()=>{ try{ await db.doc("settings/main").set({...settings}); toast("Saved"); }catch(e){ toast(errMsg(e)); } })();
    WK.sg=null; WK.sgEd=null; }
  if(a==="sgsheet") WK.sg={mode:"sheet"};
  if(a==="sgmenu") WK.sg=null;
  if(a==="sgans"){ const G=WK.sg; const o=G.opts[Number(v)]; G.pick=Number(v); G.ans=o[0]; if(o[0]==="y") G.pos++; }
  if(a==="sgflip") WK.sg.flip=true;
  if(a==="sgnext"){ const G=WK.sg; G.i++; G.ans=null; G.pick=null; G.opts=null; G.flip=false; if(G.mode==="role") G.pos=G.i; }
  if(a==="sprint"){ const el2=document.getElementById("wkprint"); if(el2) savePdf(el2,"Stuck-on-a-word.pdf",false,el); return; }
  wkDraw();
}

  o.innerHTML=`<div class="wkin"><div class="wkhd"><b>⏱️ 1-minute drill</b><span>${esc(S.rung?S.rung.label:(S.t.sub||""))} · Day ${S.day} set</span><button class="wkx" data-wx aria-label="Close">✕</button></div><div class="wkkid">${body}</div></div>`;
  o.querySelector("[data-wx]").onclick=()=>{ hpOmaStop(); HPO=null; wkClose(); };
  o.querySelectorAll("[data-ho]").forEach(b=>b.onclick=()=>hpOmaAct(b.dataset.ho)); }
const hpMS=s=>{ s=Math.floor(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
function hpRung(t){ if(!t.ladder) return null; const at=(HPR.omaAt||{})[t.id]; return t.ladder[at!=null?at:t.ladderAt]||t.ladder[t.ladderAt]; }
function hpSeedShuf(a,seed){ a=a.slice(); let h=2166136261; for(const ch of seed){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0; } for(let i=a.length-1;i>0;i--){ h=(Math.imul(h,1103515245)+12345)>>>0; const j=h%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hpDayNo(){ return Math.max(0,Math.round((new Date(today()+"T12:00")-new Date(HP.made+"T12:00"))/864e5)); }
function hpDaySet(pool,n,key){ const per=Math.max(1,Math.floor(pool.length/n)), d=hpDayNo(), cyc=Math.floor(d/per), k=d%per; return hpSeedShuf(pool,HP.id+key+cyc).slice(k*n,k*n+n); }
function hpOmaNew(t){ const r=hpRung(t), n=t.oma.n||10, pool=r?r.items:t.oma.items; return {t,rung:r,day:hpDayNo()+1,items:hpDaySet(pool,n,r?r.level:"x"),i:0,res:[],t0:null,secs:0,done:false}; }
function hpOmaStop(){ if(HPOtimer){ clearInterval(HPOtimer); HPOtimer=null; } }
function hpOmaAct(v){ const S=HPO; const items=S.items;
  if(v==="start"){ S.t0=Date.now(); HPOtimer=setInterval(()=>{ S.secs=(Date.now()-S.t0)/1000; const t=document.getElementById("hpotime"); if(t){ t.textContent=hpMS(S.secs); t.classList.toggle("over",S.secs>60); } },250); }
  if(v==="a"||v==="c"||v==="x"){ S.res[S.i]=v; S.i++; if(S.i>=items.length){ S.done=true; S.secs=(Date.now()-S.t0)/1000; hpOmaStop();
      const O=S.t.oma, R=S.rung; if(R){ const at=S.t.ladder.indexOf(R), a=S.res.filter(x=>x==="a").length, n=S.res.length; let to=at;
        if(a===n&&S.secs<=60&&at<S.t.ladder.length-1) to=at+1; else if(a/n<.5&&at>0) to=at-1;
        HPR.omaAt=HPR.omaAt||{}; HPR.omaAt[S.t.id]=to; S.step=to>at?"up":to<at?"down":null; S.next=S.t.ladder[to]; }
      db.collection("drills").doc().set({clientId:HP.cid,date:today(),level:R?R.level:O.level,unit:R?R.unit:O.unit,setId:O.id,setNo:O.setNo,results:S.res.slice(),secs:Math.round(S.secs),items:S.res.map((r,i)=>({w:items[i].w,a:items[i].a,r})),createdAt:Date.now()}); } }
  if(v==="undo"&&S.i){ S.i--; S.res.length=S.i; }
  if(v==="again"){ HPO=hpOmaNew(S.t); }
  if(v==="close"){ HPO=null; wkClose(); return; }
  hpOmaDraw(); }
const HP_STK=["🦖","🐙","🦄","🐢","🦊","🐝","🐳","🦜","🐸","🦒","🐧","🦀","🐨","🦘"];
const hpAdd=(d,n)=>{ const x=new Date(d+"T12:00"); x.setDate(x.getDate()+n); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
function hpChartDays(){ const out=[]; let d=HP.made; const end=HP.by&&HP.by>HP.made?HP.by:hpAdd(HP.made,7); while(d<end&&out.length<28){ out.push(d); d=hpAdd(d,1); } if(today()>=end&&!out.includes(today())&&today()<hpAdd(end,7)) out.push(today()); return out; }
function hpDays(){ return hpChartDays().filter(d=>hpDoneOn(d)>=hpPer()); }
function hpChart(){ const N=hpPer(), days=hpChartDays(), t=today(); const off=HP.id.charCodeAt(HP.id.length-1)%HP_STK.length; const full=days.filter(d=>hpDoneOn(d)>=N).length; const nToday=hpDoneOn(t); const goal=Math.max(1,Math.ceil(days.length/2));
  return `<div class="hpchart"><div class="hpch"><b>My sticker chart</b><span>${full} / ${goal} stickers</span></div>
   <div class="hptoday"><b>Today</b><span class="hptally">${[...Array(N)].map((_,i)=>`<i class="${i<nToday?"on":""}">${i<nToday?"⭐":""}</i>`).join("")}</span><small>${nToday>=N?"Done for today! 🎉":`${N-nToday} more task${N-nToday===1?"":"s"} for today's sticker`}</small></div>
   <div class="hpslots">${days.map((d,i)=>{ const n=hpDoneOn(d), got=n>=N, past=d<t; return `<span class="hpslot ${got?"on":""} ${d===t?"now":""} ${got&&d===HPpop?"pop":""}" title="${n} of ${N} tasks">${got?HP_STK[(i+off)%HP_STK.length]:n?`<em>${n}/${N}</em>`:""}<small>${esc(new Date(d+"T12:00").toLocaleDateString("en-AU",{weekday:"short"}))}</small></span>`; }).join("")}</div>
   <p class="hpsub">${full>=goal?`Goal reached! 🎉 ${full>goal?"Super extra effort!":"Any more is a bonus."}`:`Get ${goal} stickers before the next session. Do ${N} task${N===1?"":"s"} on a day to get that day's sticker. Rest days are fine!`}</p></div>`; }
let HPpop=null;
function hpStatus(t){ const d=HPR.done[t.id]; if(!d) return null; if(d.seen) return "Looked at ✓"; return `${d.a} / ${d.t} ⭐${d.n>1?` · ${d.n} goes`:""}`; }
function hpDraw(){
  if(!document.getElementById("wkov")&&!document.querySelector(".gm")) document.body.classList.remove("hpbusy");
  const side=document.getElementById("hpside"); if(!side) return;
  const kidT=HP.tasks.filter(t=>t.kind!=="stuck"), adultT=HP.tasks.filter(t=>t.kind==="stuck");
  const doneN=HP.tasks.filter(t=>HPR.done[t.id]).length;
  const tile=t=>{ const st=hpStatus(t); const on=HPcur&&HPcur.id===t.id&&(document.getElementById("wkov")||document.querySelector(".gm"));
    const td=((HPR.daily||{})[today()]||[]).includes(t.id);
    return `<button class="hptile ${td?"d":""} ${on?"on":""}" data-hp="${t.id}"><span class="ic">${t.icon}</span><span class="tx"><b>${esc(t.label)}</b><small>${esc(st||t.sub||"Start")}</small></span><span class="st">${td?"✅":"▶"}</span></button>`; };
  side.innerHTML=`<div class="hphi"><span class="hpav">${HP.av||"🙂"}</span><div><b>Hi ${esc(HP.name||HP.code)}!</b><span>Your practice</span></div></div>
   ${hpChart()}
   ${kidT.map((t,i)=>(t.sec&&(i===0||kidT[i-1].sec!==t.sec)?`<div class="hplab hpsec">${esc(t.sec)}</div>`:"")+tile(t)).join("")}
   ${adultT.length?`<div class="hplab">For grown-ups</div>${adultT.map(tile).join("")}`:""}
   ${HP.msg?`<div class="hpmsg">💬 ${esc(HP.msg)}</div>`:""}
   <div class="hpsend">${hpSendBox(doneN)}</div>
   <p class="hpfine">Made ${esc(new Date(HP.made+"T00:00").toLocaleDateString("en-AU",{day:"numeric",month:"long"}))} by ${esc(HP.from||"your speech pathologist")}. Your practice is saved in this browser only.</p>`;
  side.querySelectorAll("[data-hp]").forEach(b=>b.onclick=()=>hpStart(b.dataset.hp));
  hpBindSend(side);
  const main=document.getElementById("hpmain");
  const nT=hpDoneOn(today()), N=hpPer();
  if(main) main.innerHTML=`<div class="hpwel"><div class="hpbig">${nT>=N?"🎉":"👈"}</div><h2>${nT>=N?"Today's sticker is yours!":nT?"Nice work. Pick the next one.":"Pick a task to start"}</h2><p>${nT} of ${N} tasks today</p></div>`;
}
function hpSendBox(doneN){
  const byTxt=HP.by?new Date(HP.by+"T12:00").toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long"}):"";
  const due=(HP.by&&today()>=hpAdd(HP.by,-1));
  const head=`<p class="hpsub ${due?"hpdue":""}">${due?"📮 Time to send your results to "+esc(HP.from||"your speech pathologist")+"!":`Send your results to ${esc(HP.from||"your speech pathologist")}${byTxt?` before <b>${esc(byTxt)}</b>`:""}. Send it any time; you can keep practising after.`}</p>`;
  if(!doneN) return head;
  if(!HPres) return head+`<button class="hpgo ${due?"":"o"}" data-hpsend>📮 Send my results</button>`;
  if(!HPres) return `<button class="hpgo" data-hpsend>📮 Send my results</button>`;
  return head+`<p class="hpsub">Send this code to ${esc(HP.from||"your speech pathologist")}:</p><textarea class="hpcode" readonly rows="3">${esc(HPres)}</textarea>
   <div class="hprow"><button class="hpgo" data-hpcopy>📋 Copy</button>${HP.email?`<a class="hpgo o" href="mailto:${esc(HP.email)}?subject=${encodeURIComponent("Practice results "+HP.code)}&body=${encodeURIComponent(`Hi ${HP.from||""},\n\nHere are ${HP.code}'s practice results:\n\n${HPres}\n`)}">✉️ Email</a>`:""}${navigator.share?`<button class="hpgo o" data-hpshare>Share…</button>`:""}</div>`;
}
function hpBindSend(el){
  const s=el.querySelector("[data-hpsend]"); if(s) s.onclick=async()=>{ HPres=await hpEncode({v:1,id:HP.id,cid:HP.cid,code:HP.code,made:HP.made,sent:today(),recs:HPR.recs}); hpDraw(); };
  const c=el.querySelector("[data-hpcopy]"); if(c) c.onclick=async()=>{ try{ await navigator.clipboard.writeText(HPres); toast("Copied!"); }catch(e){ const t=el.querySelector(".hpcode"); t.select(); document.execCommand("copy"); toast("Copied!"); } };
  const sh=el.querySelector("[data-hpshare]"); if(sh) sh.onclick=()=>navigator.share({title:"Practice results "+HP.code,text:HPres}).catch(()=>{});
}
const hpB64=u=>{ let s=""; for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
async function hpEncode(obj){ const json=JSON.stringify(obj);
  try{ const st=new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw")); const buf=new Uint8Array(await new Response(st).arrayBuffer()); return "BSE1."+hpB64(buf); }
  catch(e){ return "BSE0."+hpB64(new TextEncoder().encode(json)); } }
document.body.classList.add("hp");
document.body.insertAdjacentHTML("afterbegin",`<aside id="hpside"></aside><main id="hpmain"></main>`);
