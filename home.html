/* ---------- Word study toolkit ---------- */
.v2card.pres .panel{margin:0 0 14px}
.wkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.wkc{background:var(--card,#fff);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:5px}
.wkc .ic{font-size:1.35rem;line-height:1}.wkc b{font-size:1rem}.wkc p{margin:0;color:var(--muted);font-size:.87rem}
.wkc .ex{font-family:Andika,sans-serif;color:var(--muted);font-size:.9rem}
.wkc .ex u{text-decoration:none;background:var(--slow-soft);border-radius:3px;padding:0 2px}
.wkc .last{font-size:.78rem;color:var(--auto);font-weight:700}
.wkc .bt{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
/* overlay: fixed light palette, kid-facing */
.wkov{--k:#1E2226;--m:#5B6570;--l:#D7DBD9;--g:#2F6B66;--gs:#DCE9E7;--y:#A07A35;--ys:#F1E8D6;--r:#8A2B3D;--rs:#F2E1E4;
  position:fixed;inset:0;z-index:2000;background:#FFFDF7;color:var(--k);overflow:auto;font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.wkin{max-width:980px;margin:0 auto;padding:16px 16px 60px}
.wkhd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.wkhd b{font-size:1.1rem}.wkhd span{color:var(--m)}
.wkx{margin-left:auto;font:inherit;font-size:1.2rem;width:44px;height:44px;border-radius:50%;border:1px solid var(--l);background:#fff;color:var(--k);cursor:pointer}
.wkov button{cursor:pointer}
.wkkid{text-align:center;font-family:Andika,"Atkinson Hyperlegible",sans-serif}
.wkpad{max-width:820px;margin:0 auto}
.wkq{color:var(--m);font-size:1rem;margin:6px 0}
.wkbig{font-size:clamp(2.4rem,9vw,4.6rem);letter-spacing:.04em;margin:18px 0;line-height:1.2}
.wkbig u,.wkgloss u{text-decoration:none;background:var(--ys);color:var(--y);border-radius:6px;padding:0 4px}
.wkbig small,.wkgloss small{font-size:.4em;color:var(--m)}
.wkopts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wkopts button,.wknav button,.wkbands button,.wkseg button,.wkpick button{font:inherit;color:var(--k);background:#fff;border:2px solid var(--l);border-radius:12px}
.wkopts button{font-size:1.25rem;padding:12px 22px}

    const GI={"Word building":"🧩","Speed read":"⚡","Pairs":"🃏","Spelling sort":"🗂️"}[GM.title]||"";
    r.innerHTML=`<div class="wkin">${typeof wkCrumbGM==="function"?wkCrumbGM():""}<div class="wkhd"><b>${GI} ${esc(GM.title)}</b><span>${esc(GM.c.code)} · ${esc(gmSetObj().label)}</span><button class="wkx" data-g="close" aria-label="Close">✕</button></div><div class="wkkid gm-stage">${GM.view()}</div></div>`;
  }
  r.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ if(b.dataset.g==="close") gmClose(); else { clearInterval(GM.timer); GM.game=null; gmRender(); } });
  r.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{ GM.set=b.dataset.set; gmRender(); });
  r.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>gmStart(b.dataset.game));

}
function gmHistory(){
  const runs=gameruns.filter(g=>g.clientId===GM.c.id&&g.set===GM.set).sort((a,b)=>b.createdAt-a.createdAt).slice(0,4);
  if(!runs.length) return "";
  const nm={build:"Word building",speed:"Speed read",sort:"Spelling sort",pairs:"Pairs"};
  return `<div class="gm-hist"><b>Last time</b>${runs.map(g=>`<span>${nm[g.game]||g.game}: ${g.correct}/${g.total}${g.ms?` in ${lfFmt(g.ms)}`:""}</span>`).join("")}</div>`;
}
function gmSave(game, correct, total, ms, items){
  if(!canWrite||!GM.c) return;
  db.collection("games").doc().set({clientId:GM.c.id, date:today(), game, set:GM.set, label:gmSetObj().label, correct, total, ms:ms?Math.round(ms):null, items:items||null, createdAt:Date.now()}).catch(e=>toast(errMsg(e)));
}
function gmCheer(){ return ["Awesome!","You got it!","Super reading!","Nailed it!","Brilliant!","Yes!"][Math.floor(Math.random()*6)]; }
function gmDone(title, line, again){
  return `<div class="gm-done">${gmMe(110)}<h3>${title}</h3><p>${line}</p><div class="gm-act"><button class="gm-big" data-a="again">Play again</button><button class="gm-ghost" data-g="menu">Pick another game</button></div></div>`;
}
function gmStart(game){
  const set=gmSetObj(); GM.game=game; clearInterval(GM.timer);
  if(game==="build") gmBuildInit(set);
  else if(game==="speed") gmSpeedInit(set);
  else if(game==="sort") gmSortInit(set);
  else gmPairsInit(set);
  gmRender();
}

/* --- word building --- */
function gmBuildInit(set){
  const pool=gmShuffle(set.words.filter(gmBuildable)).slice(0,8);
  GM.title="Word building";
  GM.st={pool, i:0, slots:[], first:0, tries:0, done:false, ok:null};
  const alt=x=>{ const g=gmSplit(x.w).map((t,k)=>({t,k})); let s=gmShuffle(g), n=0; while(g.length>1&&n++<10&&s.every((v,i)=>v.t===g[i].t)) s=gmShuffle(g); return s; }; // only the sounds this word needs
  GM.newWord=()=>{ const x=GM.st.pool[GM.st.i]; GM.st.tiles=alt(x); GM.st.slots=[]; GM.st.tries=0; GM.st.ok=null; setTimeout(()=>gmSay(gmPlain(x.w)),250); };
  GM.newWord();
  GM.view=()=>{
    const s=GM.st; if(s.done) return gmDone(gmCheer(), `You built ${s.first} of ${s.pool.length} words first try.`);
    const x=s.pool[s.i], g=gmSplit(x.w), em=GM_EMOJI[gmPlain(x.w).toLowerCase()];
    return `<div class="gm-prog">${s.pool.map((_,k)=>`<i class="${k<s.i?"done":k===s.i?"cur":""}"></i>`).join("")}</div>
      <div class="gm-clue"><button class="gm-say" data-a="say" aria-label="Hear the word">🔊</button>${em?`<span class="gm-em">${em}</span>`:""}</div>
      <div class="gm-slots ${s.ok===false?"shake":""}">${g.map((t,k)=>{ const f=s.slots[k]; const bad=s.ok===false&&f&&f.t!==t; return `<button class="gm-slot ${f?"full":""} ${bad?"bad":""} ${s.ok?"good":""}" data-slot="${k}">${f?esc(f.t):""}</button>`; }).join("")}</div>
      ${s.ok?`<p class="gm-msg">${gmCheer()} Say the sounds, then read it: <b>${esc(gmPlain(x.w))}</b></p><div class="gm-act"><button class="gm-big" data-a="next">${s.i+1<s.pool.length?"Next word ›":"Finish ›"}</button></div>`
        :`<div class="gm-tiles">${s.tiles.map((t,k)=>`<button class="gm-tile" data-tile="${k}" ${s.slots.includes(t)?"disabled":""}>${esc(t.t)}</button>`).join("")}</div>${s.ok===false?`<p class="gm-msg">Nearly! Tap the red one to take it out and try again.</p>`:""}`}`;
  };
  GM.bind=r=>{
    const s=GM.st, x=s.pool[s.i];
    r.querySelectorAll("[data-a=say]").forEach(b=>b.onclick=()=>gmSay(gmPlain(x.w)));
    r.querySelectorAll("[data-a=again]").forEach(b=>b.onclick=()=>gmStart("build"));
    r.querySelectorAll("[data-tile]").forEach(b=>b.onclick=()=>{ const g=gmSplit(x.w); const t=s.tiles[Number(b.dataset.tile)]; const k=s.slots.findIndex(v=>!v); const pos=k<0?s.slots.length:k; if(pos>=g.length) return; s.slots[pos]=t; s.ok=null;
      if(s.slots.filter(Boolean).length===g.length){ const ok=g.every((tt,j)=>s.slots[j].t===tt); s.tries++; s.ok=ok; if(ok&&s.tries===1) s.first++; if(!ok&&!s.firstBuilt) s.firstBuilt=g.map((_,j)=>s.slots[j].t).join("·"); }
      gmRender(); });
    r.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{ if(s.ok) return; s.slots[Number(b.dataset.slot)]=undefined; s.ok=null; gmRender(); });
    r.querySelectorAll("[data-a=next]").forEach(b=>b.onclick=()=>{ (s.log=s.log||[]).push({w:gmPlain(x.w), r:s.tries===1?"a":"x", tries:s.tries, ch:s.firstBuilt||null}); s.firstBuilt=null; s.i++; if(s.i>=s.pool.length){ s.done=true; gmSave("build", s.first, s.pool.length, null, s.log); } else GM.newWord(); gmRender(); });
  };
}

/* --- speed read --- */
function gmSpeedInit(set){
  GM.title="Speed read";
  const words=gmShuffle(set.words).slice(0,12).map(x=>gmPlain(x.w));
  GM.st={words, read:new Set(), t0:null, ms:0, done:false};
  const best=()=>{ const r=gameruns.filter(g=>g.clientId===GM.c.id&&g.set===GM.set&&g.game==="speed"&&g.ms); return r.length?Math.min(...r.map(g=>g.ms)):null; };
  GM.view=()=>{
    const s=GM.st, b=best();
    if(s.done) return gmDone(b===null||s.ms<=b?"New best time! 🏆":gmCheer(), `All ${s.words.length} words in <b>${lfFmt(s.ms)}</b>${b!==null&&s.ms>b?` (best ${lfFmt(b)})`:""}.`);
    return `<div class="gm-timer"><span id="gm-t">${s.t0?lfFmt(Date.now()-s.t0):"0.0s"}</span>${b!==null?`<small>best ${lfFmt(b)}</small>`:""}<span class="gm-left">${s.words.length-s.read.size} to go</span></div>
      ${s.t0?`<div class="gm-ring"><div class="gm-ringmid"><b>${s.words.length-s.read.size}</b><small>to go</small></div>${s.words.map((w,k)=>{ const an=(k/s.words.length)*2*Math.PI-Math.PI/2; return `<button class="gm-word ${s.read.has(k)?"read":""}" data-w="${k}" style="left:${(50+40*Math.cos(an)).toFixed(2)}%;top:${(50+40*Math.sin(an)).toFixed(2)}%">${esc(w)}</button>`; }).join("")}</div><p class="gm-msg small">Go round the circle. Tap each word once it's read correctly.</p>`
        :`<div class="gm-act"><button class="gm-big" data-a="go">Ready, set, go!</button></div><p class="gm-msg small">Read each word out loud. Your grown-up taps it when you get it right.</p>`}`;
  };
  GM.bind=r=>{
    const s=GM.st;
    r.querySelectorAll("[data-a=again]").forEach(b=>b.onclick=()=>gmStart("speed"));
    r.querySelectorAll("[data-a=go]").forEach(b=>b.onclick=()=>{ s.t0=Date.now(); clearInterval(GM.timer); GM.timer=setInterval(()=>{ const t=document.getElementById("gm-t"); if(t) t.textContent=lfFmt(Date.now()-s.t0); },100); gmRender(); });
    r.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ const k=Number(b.dataset.w); s.tap=s.tap||{}; if(s.read.has(k)){ s.read.delete(k); delete s.tap[k]; } else { s.read.add(k); s.tap[k]=Date.now()-s.t0; }
      if(s.read.size===s.words.length){ s.ms=Date.now()-s.t0; clearInterval(GM.timer); s.done=true; gmSave("speed", s.words.length, s.words.length, s.ms, Object.entries(s.tap).sort((a,b)=>a[1]-b[1]).map(([k,t])=>({w:s.words[k], r:"a", t}))); }
      gmRender(); });
  };
}

/* --- spelling sort (Extended Code) --- */
function gmSortInit(set){
  GM.title="Spelling sort";
  const bySp={}; set.words.forEach(x=>(bySp[x.sp]=bySp[x.sp]||[]).push(x));
  const sps=Object.keys(bySp).sort((a,b)=>bySp[b].length-bySp[a].length).slice(0,set.sp.length>3?4:3).filter(Boolean);
  const pool=gmShuffle(sps.flatMap(sp=>gmShuffle(bySp[sp]).slice(0,3)));
  GM.st={sps, pool, i:0, right:0, firstTry:true, wrong:null, bins:Object.fromEntries(sps.map(s=>[s,[]])), done:false};
  GM.view=()=>{
    const s=GM.st;
    if(s.done) return gmDone(gmCheer(), `${s.right} of ${s.pool.length} sorted first try.`);
    const x=s.pool[s.i];
    return `<div class="gm-prog">${s.pool.map((_,k)=>`<i class="${k<s.i?"done":k===s.i?"cur":""}"></i>`).join("")}</div>
      <p class="gm-msg">Read it. Which spelling of <b>/${esc(set.sound)}/</b> is it?</p>
      <div class="gm-bigword ${s.wrong?"shake":""}"><button class="gm-say" data-a="say" aria-label="Hear the word">🔊</button>${esc(gmPlain(x.w))}</div>
      <div class="gm-bins">${s.sps.map(sp=>`<button class="gm-bin ${s.wrong===sp?"bad":""}" data-bin="${esc(sp)}"><b>${esc(sp)}</b><span class="gm-binlist">${s.bins[sp].map(w=>`<span>${esc(w)}</span>`).join("")}</span></button>`).join("")}</div>`;
  };
  GM.bind=r=>{
    const s=GM.st, x=s.pool[s.i];
    r.querySelectorAll("[data-a=again]").forEach(b=>b.onclick=()=>gmStart("sort"));
    r.querySelectorAll("[data-a=say]").forEach(b=>b.onclick=()=>gmSay(gmPlain(x.w)));
    r.querySelectorAll("[data-bin]").forEach(b=>b.onclick=()=>{ const sp=b.dataset.bin;
      if(sp===x.sp){ if(s.firstTry) s.right++; (s.log=s.log||[]).push({w:gmPlain(x.w), r:s.firstTry?"a":"x", ch:s.firstTry?null:s.wrongs.join(", "), sp:x.sp}); s.wrongs=[]; s.bins[sp].push(gmPlain(x.w)); s.i++; s.firstTry=true; s.wrong=null;
        if(s.i>=s.pool.length){ s.done=true; gmSave("sort", s.right, s.pool.length, null, s.log); } }
      else { s.firstTry=false; s.wrong=sp; (s.wrongs=s.wrongs||[]).push(sp); }
      gmRender(); });
  };
}

/* --- pairs --- */
function gmPairsInit(set){
  GM.title="Pairs";
  const words=gmShuffle(set.words).slice(0,6).map(x=>gmPlain(x.w));
  GM.st={cards:gmShuffle(words.concat(words)).map(w=>({w,up:false,won:false})), pick:[], flips:0, t0:Date.now(), done:false, lock:false};
  GM.view=()=>{
    const s=GM.st;
    if(s.done) return gmDone(gmCheer(), `All 6 pairs in ${s.flips} turns.`);
    const last=s.pick.length===2&&s.cards[s.pick[0]].w===s.cards[s.pick[1]].w;
    return `<p class="gm-msg">${last?`A pair! Say the sounds and read it: <b>${esc(s.cards[s.pick[0]].w)}</b>`:"Turn over two cards. Read each one."}</p>
      <div class="gm-pairs">${s.cards.map((cd,k)=>`<button class="gm-pc ${cd.up||cd.won?"up":""} ${cd.won?"won":""}" data-pc="${k}" ${cd.won?"disabled":""}>${cd.up||cd.won?esc(cd.w):"?"}</button>`).join("")}</div>`;
  };
  GM.bind=r=>{
    const s=GM.st;
    r.querySelectorAll("[data-a=again]").forEach(b=>b.onclick=()=>gmStart("pairs"));
    r.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{
      if(s.lock) return; const k=Number(b.dataset.pc); const cd=s.cards[k]; if(cd.up||cd.won) return;
      if(s.pick.length===2){ s.pick.forEach(i=>{ if(!s.cards[i].won) s.cards[i].up=false; }); s.pick=[]; }
      cd.up=true; s.pick.push(k);
      if(s.pick.length===2){ s.flips++; const [a,c2]=s.pick.map(i=>s.cards[i]);
        if(a.w===c2.w){ a.won=c2.won=true; if(s.cards.every(x=>x.won)){ setTimeout(()=>{ s.done=true; gmSave("pairs", 6, s.flips, Date.now()-s.t0, [...new Set(s.cards.map(x=>x.w))].map(w=>({w,r:"a"}))); gmRender(); },1200); } }
        else { s.lock=true; setTimeout(()=>{ s.lock=false; s.pick.forEach(i=>s.cards[i].up=false); s.pick=[]; gmRender(); },1100); } }
      gmRender(); });
  };
}

  {id:"t2",n:"g says /j/ before e, i, y",tip:"g can say /j/ before e, i, y.",ex:"gem, giant, gym",w:"(g|j)em (g|j)iant (g|j)ym (g|j)inger ma(g|j)ic ener(g|j)y (g|j)entle (g|j)iraffe",

  {id:"t3",type:"exc",n:"Spot the exceptions",ex:"get, give, girl",w:"gem:r get:x giant:r give:x gym:r girl:x gentle:r gift:x magic:r tiger:x ginger:r begin:x",why:"In these, g says /g/ even before e or i."}],
 r12c:[

 r12b:[

 r25:[
  {id:"t0",type:"sl",n:"Short or long?",ex:"badge / cage, ledge / page",w:"badge:s cage:l ledge:s page:l fudge:s huge:l bridge:s stage:l hedge:s wage:l judge:s rage:l"},

  {id:"t2",n:"ge after a long vowel or consonant",tip:"Long vowel or a consonant before /j/? Just ge.",ex:"cage, change",w:"ca(ge|dge) pa(ge|dge) hu(ge|dge) sta(ge|dge) a(ge|dge) chan(ge|dge) oran(ge|dge) lar(ge|dge) bul(ge|dge) plun(ge|dge)",

  {id:"t3",n:"dge in longer words",tip:"Short vowel before /j/? dge, even in longer words.",ex:"budget, gadget",w:"bu(dg|g)et ga(dg|g)et ba(dg|g)er he(dg|g)ehog fi(dg|g)et porri(dge|ge)",

 r27:[

  {id:"t1",n:"tch after a short vowel",tip:"Short vowel right before /ch/? Use tch.",ex:"catch, witch",w:"ca(tch|ch) ma(tch|ch) fe(tch|ch) wi(tch|ch) pa(tch|ch) ha(tch|ch) ske(tch|ch) scra(tch|ch) swi(tch|ch) hu(tch|ch) cru(tch|ch) ba(tch|ch)",

  {id:"t2",n:"ch after a consonant or two vowels",tip:"After a consonant or two vowels, just ch.",ex:"bench, beach",w:"ben(ch|tch) lun(ch|tch) bun(ch|tch) pin(ch|tch) bea(ch|tch) tea(ch|tch) coa(ch|tch) pea(ch|tch) spee(ch|tch)",

  {id:"t3",n:"tch in longer words",tip:"Short vowel before /ch/? tch, even in longer words.",ex:"kitchen, butcher",w:"ki(tch|ch)en bu(tch|ch)er ke(tch|ch)up ma(tch|ch)box ha(tch|ch)ing sti(tch|ch)es",

  {id:"t4",type:"exc",n:"Spot the exceptions",ex:"much, such, rich",w:"catch:r much:x match:r such:x fetch:r rich:x witch:r which:x patch:r sandwich:x hutch:r ostrich:x",why:"These have a short vowel but use ch, not tch."}],
 r7:[
  {id:"t1",n:"-y in longer words",tip:"/ee/ at the end of a longer word: y.",ex:"happy, family",w:"happ(y|ee) funn(y|ee) bab(y|ee) part(y|ee) sunn(y|ee) pon(y|ee) loll(y|ee) famil(y|ee) stor(y|ee) wind(y|ee)",

 r5:[
  {id:"t0",type:"sl",n:"/i/ or /ie/?",...SLQ("Does the i or y say /i/ or /ie/?",{s:"/i/ (short)",l:"/ie/ (says its name)"},{s:"Short: a quick /i/, like in sit.",l:"Long: it says its name, like in tiger."}),ex:"tiger / animal",w:"tiger:l animal:s pilot:l family:s spider:l visit:s lion:l ribbon:s python:l gym:s tyre:l mystery:s"},

   s:["A koala is an *an(i|u)mal*.","My *fam(i|u)ly* went camping.","We went on *hol(i|u)day*.","*D(i|u)vide* the cake into four."]},
  {id:"t3",n:"y in the middle",tip:"In the middle of a word, y can do i's job: gym, tyre.",ex:"gym, tyre",w:"c(y|i)cle p(y|i)thon t(y|i)re st(y|i)le g(y|i)m m(y|i)stery s(y|i)rup cr(y|i)stal",
   s:["Pump up the bike *t(y|i)re*.","I saw a *p(y|i)thon* in the shed!","Pancakes with maple *s(y|i)rup*.","We solved the *m(y|i)stery*.","We do PE in the *g(y|i)m*.","I love your *st(y|i)le*!"]}],
 r10:[
  {id:"t0",type:"sl",n:"a or er?",...SLQ("Does it end in a or er?",{a:"a",e:"er"},{a:"Animals and borrowed words often end in a: koala, pizza.",e:"Lots of everyday words end in er: sister, dinner."}),ex:"pizza / ladder",w:"pizza:a ladder:e koala:a sister:e sofa:a dinner:e panda:a water:e zebra:a butter:e camera:a teacher:e"},
  {id:"t1",n:"a at the end",tip:"In Aussie English it sounds like /er/, but it's spelled a.",ex:"pizza, koala",w:"pizz(a|er) koal(a|er) pand(a|er) sof(a|er) extr(a|er) dram(a|er) banan(a|er) zebr(a|er) camer(a|er) gorill(a|er) umbrell(a|er)",

 r12d:[

 r18:[

 r19:[
  {id:"t1",n:"Add -ed",tip:"Past tense: add -ed, even if it sounds like /t/ or /d/.",ex:"jumped, played",w:"jump(ed|t) play(ed|d) want(ed|id) help(ed|t) open(ed|d) look(ed|t) kick(ed|t) wash(ed|t) call(ed|d) rain(ed|d)",

 r20:[
  {id:"t0",type:"sl",n:"Which sound?",...SLQ("What sound does the -ed make?",{t:"/t/",d:"/d/",i:"/id/"},{t:"After a quiet sound like p, k, s, sh or ch, it says /t/.",d:"After a voice sound, it says /d/.",i:"After t or d, -ed is its own syllable: /id/."}),ex:"jumped / played / wanted",w:"jumped:t played:d wanted:i looked:t filled:d needed:i kissed:t rained:d landed:i washed:t opened:d painted:i"},
  {id:"t1",n:"-ed says /id/",tip:"Even when you hear /id/, write ed.",ex:"wanted, landed",w:"want(ed|id) need(ed|id) land(ed|id) paint(ed|id) shout(ed|id) count(ed|id) melt(ed|id) wait(ed|id)",

  {id:"t2",n:"-ed says /t/",tip:"Even when you hear /t/, write ed.",ex:"jumped, washed",w:"jump(ed|t) kiss(ed|t) wash(ed|t) look(ed|t) pick(ed|t) help(ed|t) dress(ed|t) laugh(ed|t)",

  {id:"t3",n:"-ed says /d/",tip:"Even when you hear /d/, write ed.",ex:"played, filled",w:"play(ed|d) fill(ed|d) open(ed|d) rain(ed|d) call(ed|d) yell(ed|d) clean(ed|d) smell(ed|d)",
   s:["Gran *call(ed|d)* me.","I *clean(ed|d)* my room.","It *rain(ed|d)* at the footy.","We *open(ed|d)* our presents.","I *fill(ed|d)* the bucket.","The bin *smell(ed|d)*!"]}],
 r21:[
  {id:"t1",n:"Add -s",tip:"Most plurals: just add s, even if it sounds like /z/.",ex:"cats, dogs",w:"cat(s|z) dog(s|z) bird(s|z) cup(s|z) toy(s|z) shoe(s|z) apple(s|z) frog(s|z) bike(s|z) tree(s|z)",

  {id:"t2",n:"-es after s, x, z, sh, ch",tip:"After s, x, z, sh or ch, add es.",ex:"boxes, wishes",w:"box(es|s) dish(es|s) bus(es|s) fox(es|s) wish(es|s) lunch(es|s) brush(es|s) glass(es|s) bench(es|s) watch(es|s)",

  {id:"t4",n:"f to -ves",tip:"Many words ending in f change to ves.",ex:"leaf → leaves",w:"lea(ves|fs) wol(ves|fs) hal(ves|fs) kni(ves|fs) shel(ves|fs) loa(ves|fs) cal(ves|fs)",

  {id:"t5",type:"exc",n:"Spot the exceptions",ex:"mice, children, sheep",w:"cats:r mice:x dogs:r children:x boxes:r sheep:x babies:r teeth:x leaves:r feet:x foxes:r men:x",why:"These plurals change the word instead of adding s or es."}],
 r22:[

 r13:[
  {id:"t0",type:"sl",n:"Short or long?",ex:"hoped / hopped",w:"hoping:l hopping:s taping:l tapping:s making:l sitting:s smiled:l stopped:s baking:l swimming:s biting:l getting:s"},

  {id:"t2",n:"Before -ed, -er, -est",tip:"Drop the e before -ed, -er, -est.",ex:"baked, nicer",w:"bak(ed|eed) smil(ed|eed) nic(er|eer) lat(er|eer) wid(est|eest) danc(er|eer) skat(er|eer) rul(er|eer) hop(ed|eed) clos(est|eest)",

  {id:"t3",n:"Keep the e before a consonant ending",tip:"Keep the e before a consonant ending like -ful or -ly.",ex:"hopeful, lately",w:"(hopeful|hopful) (lately|latly) (careful|carful) (lovely|lovly) (safely|safly) (useful|usful) (homeless|homless) (excitement|excitment) (nicely|nicly) (statement|statment)",

 r14:[
  {id:"t0",type:"sl",n:"Short or long?",ex:"hopping / hoping",w:"hopping:s hoping:l tapping:s taping:l sitting:s biting:l running:s riding:l getting:s skating:l"},
  {id:"t1",n:"One syllable + -ing",tip:"One short vowel + one consonant? Double it before -ing.",ex:"hop → hopping",w:"ho(pp|p)ing ru(nn|n)ing swi(mm|m)ing si(tt|t)ing ge(tt|t)ing sho(pp|p)ing cla(pp|p)ing ski(pp|p)ing ba(tt|t)ing dro(pp|p)ing",
   s:["We went *swi(mm|m)ing* at the beach.","I'm *ge(tt|t)ing* a puppy!","Stop *ru(nn|n)ing* inside.","We went *sho(pp|p)ing* for shoes.","Who's *ba(tt|t)ing* next?","Everyone was *cla(pp|p)ing*."]},
  {id:"t2",n:"One syllable + -ed, -er",tip:"One short vowel + one consonant? Double it before -ed and -er.",ex:"stopped, bigger",w:"sto(pp|p)ed ho(pp|p)ed cla(pp|p)ed bi(gg|g)er ho(tt|t)er ru(nn|n)er swi(mm|m)er sa(dd|d)er dro(pp|p)ed gri(nn|n)ed",
   s:["The car *sto(pp|p)ed*.","This box is *bi(gg|g)er*.","Today is *ho(tt|t)er* than yesterday.","I *dro(pp|p)ed* my ice cream!","She's a fast *swi(mm|m)er*.","He *gri(nn|n)ed* at me."]},
  {id:"t3",n:"Don't double: two consonants or two vowels",tip:"Two consonants or two vowels at the end? Don't double.",ex:"jumping, raining",w:"jump(ing|ping) rain(ing|ning) help(ed|ped) sleep(ing|ping) fast(er|ter) read(ing|ding) cook(ing|king) wait(ing|ting)",
   s:["It's *rain(ing|ning)* again.","I *help(ed|ped)* Nan.","The baby is *sleep(ing|ping)*.","Who can run *fast(er|ter)*?","I love *read(ing|ding)*.","Dad is *cook(ing|king)* dinner."]},
  {id:"t4",n:"Two syllables, stress at the end",tip:"Two syllables? Only double if the last part is said strongest: be·GIN·ning.",ex:"beginning / visiting",w:"begi(nn|n)ing forge(tt|t)ing visi(t|tt)ing ope(n|nn)ing liste(n|nn)ing upse(tt|t)ing",
   s:["It's the *begi(nn|n)ing* of the year.","Stop *forge(tt|t)ing* your hat!","We're *visi(t|tt)ing* Nan.","The shop is *ope(n|nn)ing* soon.","Are you *liste(n|nn)ing*?"]},
  {id:"t5",n:"Double or drop?",tip:"Short vowel: double. Silent e word: drop the e.",ex:"hopping / hoping",w:"ho(pp|p)ing ho(p|pp)ing ta(pp|p)ing ta(p|pp)ing stri(pp|p)ed stri(p|pp)ed",
   s:["The frog was *ho(pp|p)ing*.","I'm *ho(p|pp)ing* for a puppy.","Who's *ta(pp|p)ing* on the window?","Dad is *ta(p|pp)ing* the box shut.","I love my *stri(p|pp)ed* shirt."]},
  {id:"t6",type:"exc",n:"Spot the exceptions",ex:"fixing, snowing",w:"fixing:x hopping:r snowing:x running:r boxer:x sitting:r playing:x swimming:r",why:"x, w and y never double."}],
 r15:[
  {id:"t1",n:"Plurals",tip:"Consonant + y? Change y to i, then add es.",ex:"baby → babies",w:"pupp(ies|ys) pon(ies|ys) berr(ies|ys) cit(ies|ys) stor(ies|ys) part(ies|ys) lad(ies|ys) bab(ies|ys)",
   s:["The *pupp(ies|ys)* are so cute.","We picked *berr(ies|ys)*.","Sydney and Melbourne are big *cit(ies|ys)*.","Tell me two *stor(ies|ys)*.","I've been to three *part(ies|ys)* this month.","Good morning, *lad(ies|ys)*!"]},
  {id:"t2",n:"-ed, -er, -est",tip:"Consonant + y? Change y to i before -ed, -er, -est.",ex:"cried, happier",w:"cr(ied|yed) tr(ied|yed) happ(ier|yer) funn(iest|yest) dr(ied|yed) eas(ier|yer) hurr(ied|yed) bus(ier|yer) carr(ied|yed) tid(ied|yed)",
   s:["I *tr(ied|yed)* my best.","This test is *eas(ier|yer)*.","That's the *funn(iest|yest)* joke!","We *hurr(ied|yed)* to school.","Mum *carr(ied|yed)* the shopping.","I *tid(ied|yed)* my room."]},
  {id:"t3",n:"-ness, -ly",tip:"Change y to i before -ness and -ly too.",ex:"happiness, happily",w:"happ(iness|yness) happ(ily|yly) eas(ily|yly) laz(iness|yness) bus(ily|yly) nois(ily|yly) angr(ily|yly)",
   s:["She smiled *happ(ily|yly)*.","I won *eas(ily|yly)*!","The dog barked *nois(ily|yly)*.","He stomped off *angr(ily|yly)*."]},
  {id:"t4",n:"Keep y after a vowel",tip:"Vowel + y? Keep the y.",ex:"played, toys",w:"play(ed|ied) stay(ed|ied) toy(s|ies) boy(s|ies) key(s|ies) enjoy(ed|ied) monkey(s|ies) day(s|ies)",
   s:["We *play(ed|ied)* all day.","I *enjoy(ed|ied)* the movie.","Pick up your *toy(s|ies)*.","The *monkey(s|ies)* swung in the trees.","We *stay(ed|ied)* up late."]},
  {id:"t5",type:"exc",n:"Spot the exceptions",ex:"paid, said, laid",w:"cried:r paid:x played:r said:x babies:r laid:x tried:r daily:x",why:"These change the y even though there's a vowel before it."}],
 r16:[
  {id:"t1",n:"y + -ing",tip:"Keep the y before -ing. Two i's can't sit together.",ex:"crying, flying",w:"cr(ying|iing) fl(ying|iing) tr(ying|iing) dr(ying|iing) carr(ying|iing) hurr(ying|iing) worr(ying|iing) stud(ying|iing) cop(ying|iing) bur(ying|iing)",
   s:["The baby is *cr(ying|iing)*.","Look at the plane *fl(ying|iing)*!","I'm *tr(ying|iing)* my best.","Stop *cop(ying|iing)* me!","The dog is *bur(ying|iing)* a bone.","He's *carr(ying|iing)* the bags."]},
  {id:"t2",n:"ie → ying",tip:"ie words change to ying: lie → lying.",ex:"lie → lying",w:"l(ying|ieing) t(ying|ieing) d(ying|ieing) unt(ying|ieing)",
   s:["The cat is *l(ying|ieing)* in the sun.","I'm *t(ying|ieing)* my shoelaces.","My phone battery is *d(ying|ieing)*."]}],
 r23:[

 r24:[

 r17:[
  {id:"t0",type:"sl",n:"sh or ti?",...SLQ("Is the /sh/ spelled sh or ti?",{sh:"sh",ti:"ti"},{sh:"sh at the start or end: fish, shop.",ti:"ti starts a later syllable: sta·tion."}),ex:"fishing / station",w:"fishing:sh station:ti shop:sh action:ti wish:sh lotion:ti splash:sh potion:ti shell:sh nation:ti"},
  {id:"t1",n:"-tion",tip:"/shun/ at the end is usually tion.",ex:"station, action",w:"sta(tion|shun) ac(tion|shun) na(tion|shun) lo(tion|shun) po(tion|shun) frac(tion|shun) sec(tion|shun) men(tion|shun) direc(tion|shun) celebra(tion|shun)",

  {id:"t2",n:"-cial and -cian",tip:"People who do a job often end in cian: musician.",ex:"special, musician",w:"spe(cial|shal) musi(cian|shun) electri(cian|shun) magi(cian|shun) so(cial|shal) offi(cial|shal)",

Object.assign(TD_PTS,{
 r6:["At the end of a short word, /ie/ is spelled y: my, fly.","In the middle, it's usually i-e: bike, time."],
 r3:["English words don't end in i, u, v or j.","v at the end? Add an e: have. u at the end? Add an e: blue.","Use y instead of i: happy. Use dge or ge instead of j: badge, cage.","Rule breakers: emu, kiwi, taxi, menu, you."],
 r9:["/ae/ at the end of a word is spelled ay: play.","In the middle, it's usually ai: rain.","Keep the ay when you add an ending: played.","Rule breakers: they, grey, obey."],
 r12a:["Silent e at the end makes the vowel say its name: hop → hope.","a-e, i-e, o-e, u-e, e-e.","Rule breakers: have, give, come, some, love, done."],
 r4:["At the end of a syllable, a, e, o and u say their name: go, me, pa·per, mu·sic.","No extra letters needed.","Rule breakers: do, to, who."],
 r8:["i and o often say their name before two consonants: kind, wild, cold, most.","No extra letters needed.","Rule breakers stay short: wind (the breeze), film, cost, lost, gift."],
 r28:["igh says /ie/: night. eigh says /ae/: eight.","augh and ough can say /or/: caught, bought.","ough has lots of sounds: though, through, rough.","gh can also say /f/: laugh, cough."],
 r1:["c says /k/ before a, o and u: cat, cot, cup.","c says /s/ before e, i and y: cent, city, cycle."],
 r2:["g says /g/ before a, o and u: gap, got, gum.","g can say /j/ before e, i and y: gem, giant, gym.","Rule breakers: get, give, girl, gift."],
 r12c:["Silent e after c makes it say /s/: face, dance.","Silent e after g makes it say /j/: cage, huge."],
 r12b:["English words don't end in v or u.","Add a silent e: have, blue."],
 r25:["dge comes straight after one short vowel: badge, bridge.","After a long vowel or a consonant, just ge: cage, change."],
 r27:["tch comes straight after one short vowel: catch, kitchen.","After a consonant or two vowels, just ch: lunch, beach.","Rule breakers: much, such, rich, which."],
 r7:["y says /ee/ at the end of a word with more than one syllable: happy, baby.","-ly says /lee/: quickly.","i can say /ee/ before another vowel: radio.","Rule breakers end in ey: key, monkey, money."],
 r5:["At the end of a syllable, i can say its name: ti·ger, pi·lot.","It can also say /i/: an·i·mal.","In the middle of a word, y can do i's job: gym, tyre."],
 r10:["Some words end in a. In Aussie English it sounds like /er/: pizza, koala.","Don't write er: it's still a."],
 r12d:["Every syllable needs a vowel, so -le gets an e: table, little.","The e stops a word looking plural: house, horse.","The e makes th buzz: breathe (but breath)."],
 r18:["sh spells /sh/ at the start or end of a word: ship, fish.","It isn't used to start a later syllable. There, use ti, ci or si: station.","Except -ship: friendship."],
 r19:["To make most verbs past tense, add -ed: jumped, played.","Even if it sounds like /t/ or /d/, write ed.","Some verbs change instead: run → ran, go → went."],
 r20:["-ed says /id/ after t or d: wanted, landed.","After other sounds it says /t/ or /d/: jumped, played.","It's always spelled ed."],
 r21:["Most plurals: add s: cats.","After s, x, z, sh or ch: add es: boxes.","Consonant + y: change to ies: babies.","Some f words change to ves: leaves.","Some just change: mice, children, sheep."],
 r22:["For he, she or it, add s: she runs.","After s, x, z, sh or ch: add es: he fixes.","Consonant + y: change to ies: she tries.","Only four are irregular: has, does, goes, is."],
 r13:["Drop the silent e before an ending that starts with a vowel: hope → hoping.","Keep it before an ending that starts with a consonant: hopeful, lately."],
 r14:["One syllable, one short vowel, one consonant? Double it before a vowel ending: hop → hopping.","Two consonants or two vowels? Don't double: jumping, raining.","Two syllables? Double only if the end is said strongest: beginning.","x, w and y never double: fixing, snowing."],
 r15:["Consonant + y? Change y to i before an ending: baby → babies, cry → cried.","Vowel + y? Keep the y: played, toys.","But not before -ing (that's the next rule)."],
 r16:["Keep the y before -ing: crying, flying.","Two i's never sit together in English words.","ie changes to y before -ing: lie → lying."],
 r23:["all- at the start of a word drops an l: always, almost.","It's al-, with one l."],
 r24:["-ful at the end of a word has one l: helpful.","Consonant + y: change to i first: beautiful."],
 r17:["ti, ci and si say /sh/ at the start of a later syllable: station, special, tension.","/shun/ is usually tion. People with jobs: cian (musician).","si can also say /zh/: vision."]});
Object.assign(TD_STORY,{
 r6:[{t:"Kite Day",x:"On a windy day, we went to {fli>fly} my new kite. It went up into the {ski>sky}. My little brother started to {cri>cry} because he wanted a go. \"{Wi>Why} not share?\" said Mum. So we took turns. We had to {tri>try} three times to get it down from a tree. Then we went home to {dri>dry} off."},
     {t:"Brekky Time",x:"Dad said he would {fri>fry} some eggs. {Mi>My} sister said, \"{Bi>By} the way, I hate eggs!\" Dad said, \"Just {tri>try} one bite.\" She was too {shi>shy} to say no. Now she loves them. {Wi>Why} did she ever say she hated them?"}],
 r3:[{t:"The Lost Glove",x:"It was a cold day and I lost my {glov>glove}. I looked under the {bridj>bridge} and on every {paj>page} of my book. My {babi>baby} brother was no help. Then I found a {clu>clue}: a {blu>blue} thread on the dog's nose!"},
     {t:"Footy Final",x:"We {liv>live} for footy in our house. At the final, I wore my {blu>blue} scarf. The crowd made a {huj>huge} noise. Dad said, \"I {lov>love} this team!\" Our player ran along the {ej>edge} of the field and scored. Everyone was so {happi>happy}."}],
 r9:[{t:"Holiday Postcard",x:"Dear Nan, we are on {holidai>holiday} in Cairns. Every {dai>day} we go to the beach. We {plaid>played} in the waves and saw a {stingrai>stingray}! We will {stai>stay} here until {Sundai>Sunday}. See you soon!"},
     {t:"Rainy Day",x:"It rained all {dai>day}. We could not go out to {plai>play}. Mum said, \"{Mai>May} I suggest a board game?\" We {plaied>played} until lunch, then had a {trai>tray} of muffins. What a great {wai>way} to spend the day!"}],
 r12a:[{t:"Bike Ride",x:"On Saturday I rode my {bik>bike} to the {lak>lake}. I saw a {snak>snake} sunbaking on a big {ston>stone}. I tried to {hid>hide} behind a tree! Then I rode home to tell Mum. She made me a {cak>cake} to calm down."},
       {t:"Game Night",x:"On Friday we played a {gam>game} at {hom>home}. Dad told a {jok>joke} and we all laughed. It was my {tim>time} to roll the dice. I got a six and won! Mum gave me a big {smil>smile} and a glass of {grap>grape} juice."}],
 r4:[{t:"My Robot",x:"My {roabot>robot} can say hello. It can carry {paiper>paper} and sing to the {baiby>baby}. When I say \"{Goe>Go}!\" it zooms off. Once it rolled into the {oapen>open} fridge and ate all the {baicon>bacon}!"},
     {t:"Snow Trip",x:"\"{Wee>We} are going to the snow!\" said Dad. \"{Noe>No} way!\" I said. I was {soe>so} excited. {Shee>She} packed a warm coat for {mee>me}. On the drive I read a {paiper>paper} map."}],
 r8:[{t:"The Wild Walk",x:"We went for a walk in the {wighld>wild} bush. It was {coald>cold} and windy. I had to {hoald>hold} Dad's hand. We saw a {boalt>bolt} of lightning far away. I was {kighnd>kind} to my sister and gave her my jumper. We nearly got {loast>lost}!"},
     {t:"Lost and Found",x:"I couldn't {fighnd>find} my {goald>gold} ring. I looked {behighnd>behind} the couch. Mum {toald>told} me to check my coat pocket. \"Never {mighnd>mind},\" she said. \"{Moast>Most} things turn up in the end.\" And there it was!"}],
 r28:[{t:"The Night Fright",x:"Last {nite>night}, I heard a noise. I got a big {frite>fright}! I {thort>thought} it was a ghost. I turned on the {lite>light}. It was just the dog, being {norty>naughty}. We both had a good {larf>laugh}."},
      {t:"Shopping Trip",x:"Mum and I went shopping. She {bort>bought} {eyt>eight} apples and some pizza {doe>dough}. On the way home it rained and the road was {ruff>rough}. Our {naybour>neighbour} helped carry the bags. We were {thru>through} the door just in time!"}],
 r1:[{t:"Circus Night",x:"We went to the {sircus>circus} in the {sity>city}. A clown rode a tiny {unisycle>unicycle}. We ate {fansy>fancy} ice creams and sat in a big {sircle>circle}. In the {sentre>centre}, an acrobat flew through a hoop."},
     {t:"Brekky in the City",x:"On Sunday we had brekky in the {sity>city}. I had {sereal>cereal} with fruit. Dad had a {kup>cup} of coffee. Mum spilled juice on her {koat>coat}. Then a pigeon walked in {sircles>circles} around our table. Dad laughed so much he spilled his coffee too!"}],
 r2:[{t:"Magic Show",x:"At the school concert, a {jiant>giant} magician did a {majic>magic} trick. He pulled a {jiraffe>giraffe} toy out of a hat! Then he made a {jem>gem} disappear. Everyone in the {jym>gym} clapped. He was full of {enerjy>energy}."},
     {t:"Ginger the Cat",x:"My cat {Jinger>Ginger} is very {jentle>gentle}. She sleeps by the {jate>gate}. She plays a {jame>game} with string. Once she ate my {jum>gum}! Mum said, \"That's {disjusting>disgusting}!\""}],
 r12c:[{t:"The Space Race",x:"We had a {rase>race} to build a rocket for {spase>space}. My rocket was {huj>huge}. I painted a {fase>face} on it. Then I put it on the {staje>stage}. Everyone said it was {nise>nice}. I came first {plase>place}!"},
       {t:"The Prince's Bird",x:"{Onse>Once} upon a time, a {prinse>prince} kept a bird in a {kaje>cage}. One day the bird asked for a {chanse>chance} to fly. The prince opened the door and the bird flew over the {fense>fence}. It was a strange but happy {chanje>change}."}],
 r12b:[{t:"Craft Day",x:"It was craft day at school. We had to make a {glov>glove} puppet. I used {blu>blue} wool and lots of {glu>glue}. Then I had to {solv>solve} a problem: the eyes kept falling off! I {lov>love} my puppet. I'm going to {giv>give} it to Nan."},
       {t:"Detective Dog",x:"My dog is a detective. She can find a {clu>clue} anywhere. She looked under the {stov>stove} and {abov>above} the fridge. She found my lost {tissu>tissue}. It's {tru>true}! I {hav>have} the best dog."}],
 r25:[{t:"The Fridge Raid",x:"Last night I snuck to the {frige>fridge}. I wanted some {fuge>fudge}. I tiptoed past the {edje>edge} of the couch. Then the dog barked! I had to {doje>dodge} the cat too. I ate the fudge on the window {leje>ledge}. In the morning, Mum found a chocolate {smuje>smudge} on my face!"},
      {t:"Bridge Walk",x:"Our class walked across the Story {Brige>Bridge}. We each wore a school {baje>badge}. Mrs Patel said not to lean over the {ej>edge}. A {huje>huge} boat went under us. On the other side we saw a {hej>hedge} cut into the shape of a koala. I couldn't stop {fijeting>fidgeting} with excitement."}],
 r27:[{t:"Backyard Cricket",x:"We played cricket in the backyard. I hit the ball and Dad tried to {cach>catch} it. It went over the fence! The dog ran to {fech>fetch} it from next door. Then Mum called us in for {luntch>lunch}. We had sausages with tomato {kechup>ketchup} in the {kichen>kitchen}. I had a big {scrach>scratch} on my arm from the fence."},
      {t:"The Beach Witch",x:"On Halloween, my sister dressed up as a {wich>witch}. She had a {pach>patch} on one eye. We walked to the {beatch>beach}. She tried to {snach>snatch} my lollies! I flicked the torch {swich>switch} and scared her. Our neighbour gave us each a {peatch>peach}."}],
 r7:[{t:"Sleepover",x:"My friend Jas came for a sleepover. We had a pizza {partee>party} and watched a {funnee>funny} movie. Mum read us a {storee>story}. We tried to sleep {quietlee>quietly}, but we were too {happee>happy}! The {radeo>radio} played until midnight."},
     {t:"Windy Day",x:"It was a {windee>windy} day. My {ponee>pony} ran {quicklee>quickly} across the paddock. My {babee>baby} cousin laughed. We had a {lollee>lolly} each and sat {safelee>safely} under a tree."}],
 r5:[{t:"Zoo Mystery",x:"At the zoo, we saw a {tighger>tiger} sleeping and a {lighon>lion} roaring. A {pighthon>python} was curled up in a tree. Then a {spighder>spider} ran up my leg! I was not {sighlent>silent}. It is still a {mistery>mystery} how it got there."},

const TD_STIP={r6:"/ie/ at the end of a short word: y.",r3:"No word ends in i, u, v or j.",r9:"/ae/ at the end: ay. Keep the ay when you add an ending.",r12a:"Silent e at the end makes the vowel say its name.",r4:"At the end of a syllable, the vowel says its name on its own.",r8:"Before ld, nd, lt or st, i and o often say their name. No extra letters.",r28:"igh, eigh, augh, ough: learn which one each word uses.",r1:"c says /s/ before e, i, y. Before a, o, u it says /k/.",r2:"g says /g/ before a, o, u. It can say /j/ before e, i, y.",r12c:"Silent e makes c say /s/ (ce) and g say /j/ (ge).",r12b:"No word ends in v or u. Add e: ve, ue.",r25:"Short vowel before /j/: dge. Long vowel or consonant: ge.",r27:"Short vowel before /ch/: tch. After a consonant or two vowels: ch.",r7:"/ee/ at the end of a longer word: y.",r5:"At the end of a syllable, i can say /ie/ or /i/. In the middle, y can do i's job.",r10:"Words like pizza end in a, even though it sounds like /er/.",r12d:"Every syllable needs a vowel (table). The e stops a word looking plural (house).",r18:"sh at the start or end. ti starts a later syllable: station.",r19:"Past tense: add -ed. Some verbs change instead: ran, went.",r20:"-ed can sound like /t/, /d/ or /id/, but it's always spelled ed.",r21:"Add s. After s, x, z, sh, ch: es. Consonant + y: ies. Some f words: ves.",r22:"He, she, it: add s. After s, x, z, sh, ch: es. Consonant + y: ies.",r13:"Drop the e before a vowel ending. Keep it before a consonant ending.",r14:"One short vowel + one consonant: double before a vowel ending.",r15:"Consonant + y: change y to i. Vowel + y: keep it.",r16:"Keep the y before -ing. ie changes to y: lying.",r23:"al- at the start has one l.",r24:"-ful has one l. Consonant + y: change to i first.",r17:"/shun/ at the end: tion, cian or sion. Not sh."};

const TCOLS=[["explain","Explains it"],["words","Words"],["sent","Sentences"],["fix","Fixes it"],["own","Own writing"]];
Object.entries(TD_STORY).forEach(([rid,ss])=>{ const ts=TD[rid]; if(!ts||ts.some(t=>t.id==="st")) return; const k=ts.findIndex(t=>t.type==="exc"); ts.splice(k<0?ts.length:k,0,{id:"st",type:"story",n:"Detective stories",ex:`${ss.length} cases · find the mistakes`}); });
const TMODES={story:["Detective story","fix"],choose:["Choose the spelling","words"],read:["Read it","words"],dict:["Word dictation","words"],sl:["Short or long?","words"],exc:["Spot the exceptions","words"],sent:["Sentence dictation","sent"],fix:["Fix it","fix"]};
Object.entries(TMODES).forEach(([k,v])=>{ if(!MODE_NAME[k]) MODE_NAME[k]=v[0].toLowerCase(); });

/* ---------- parsing ---------- */
function tdParse(m){ const x=/^(.*?)\((.+?)\)(.*)$/.exec(m); if(!x) return {word:m,pre:m,post:"",ans:"",opts:[],bad:m};
  const o=x[2].split("|"); return {word:x[1]+o[0]+x[3],pre:x[1],post:x[3],ans:o[0],opts:o,bad:x[1]+(o[1]||o[0])+x[3]}; }
function tdSent(s){ const x=/^(.*?)\*(.+?)\*(.*)$/.exec(s); if(!x) return {plain:s,pre:s,t:null,post:""}; const t=tdParse(x[2]); return {plain:x[1]+t.word+x[3],pre:x[1],t,post:x[3]}; }
function tdTask(rid,tid){ return (TD[rid]||[]).find(t=>t.id===tid); }
function tdWords(rid,t){ if(t.type==="mix") return t.mix.flatMap(id=>tdWords(rid,tdTask(rid,id))); return (t.w||"").split(/\s+/).filter(Boolean); }
function tdSents(rid,t){ if(t.type==="mix") return t.mix.flatMap(id=>tdTask(rid,id).s||[]); return t.s||[]; }
function tdCols(t){ return t.type==="story"?["fix"]:t.type==="sl"||t.type==="exc"?["words"]:["explain","words","sent","fix","own"]; }
function tdModes(t){ return t.type==="story"?["story"]:t.type==="sl"?["sl"]:t.type==="exc"?["exc"]:["choose","read","dict","sent","fix"]; }

/* ---------- progress ---------- */
function tdDrills(c,rid,tid){ return okdrills.filter(d=>d.clientId===c.id&&d.kind==="task"&&d.target===rid&&(!tid||d.task===tid)).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.createdAt||0)-(b.createdAt||0)); }
function tdThr(c){ const L=okLists(c); return {thr:(L&&L.thr)||80,need:(L&&L.need)||2}; }
function tdCell(c,rid,t,col){
  if(!tdCols(t).includes(col)) return {st:"na"};
  const ds=tdDrills(c,rid,t.id);
  if(col==="explain"||col==="own"){ const tk=ds.filter(d=>d.mode==="tick"&&d.step===col).pop(); return {st:tk&&tk.on?"s":"",tick:true,on:!!(tk&&tk.on),date:tk&&tk.date}; }
  const ms=ds.filter(d=>d.mode!=="tick"&&TMODES[d.mode]&&TMODES[d.mode][1]===col);
  if(!ms.length) return {st:""};
  const {thr,need}=tdThr(c); const byDay={};
  ms.forEach(d=>{ const n=d.items.length, a=d.items.filter(i=>i.r==="a").length; const p=n?Math.round(a/n*100):0; byDay[d.date]=Math.max(byDay[d.date]||0,p); });
  const days=Object.values(byDay); const good=days.filter(p=>p>=thr).length; const last=ms[ms.length-1];
  const lp=Math.round(last.items.filter(i=>i.r==="a").length/Math.max(1,last.items.length)*100);
  return {st:good>=need?"s":"p",pct:lp,good,need,last};
}
function tdNext(c,rid){
  const open=(t,col)=>{ const x=tdCell(c,rid,t,col); return x.st!=="na"&&x.st!=="s"; };
  for(const t of TD[rid]) for(const col of ["explain","words"]) if(open(t,col)) return {t,col};
  for(const col of ["sent","fix","own"]) for(const t of TD[rid]) if(open(t,col)) return {t,col};
  return null;
}
function tdLevel(c,rid){ let lv=0; for(const [col] of TCOLS){ if(TD[rid].every(t=>{ const x=tdCell(c,rid,t,col); return x.st==="na"||x.st==="s"; })) lv++; else break; } return lv; }
function tdSyncLevel(c,rid){ try{ const L=okLists(c); const r=L&&L.rules.find(x=>x.id===rid); const lv=tdLevel(c,rid); if(r&&lv>r.level) SC.setRuleLevel(c.id,rid,lv); }catch(e){} }

/* ---------- rule page ---------- */
let TR=null;
document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("[data-drule]"); if(!b||!TD[b.dataset.drule]) return;
  const c=clients.find(x=>x.id===view.clientId); if(!c) return; e.preventDefault(); e.stopPropagation(); openRule(c,b.dataset.drule); },true);
function openRule(c,rid){ wkClose(); TR={c,rid,pop:null};
  const o=document.createElement("div"); o.id="wkov"; o.className="wkov trov"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true");
  document.body.appendChild(o); document.body.style.overflow="hidden"; document.addEventListener("keydown",wkKey); WK={c,kind:"rule"}; trDraw(); }
const tdWordModes=t=>tdModes(t).filter(m=>TMODES[m][1]==="words");
function trDraw(){

  const missed=(()=>{ const d=tdDrills(c,rid).filter(d=>d.mode!=="tick").pop(); return d?d.items.filter(i=>i.r==="x").map(i=>i.p):[]; })();
  const nx=TR.nx, colName=k=>TCOLS.find(z=>z[0]===k)[1];
  const startBtn=nx?(nx.col==="explain"||nx.col==="own"?`<button class="v2b dark" data-tc="${nx.t.id}|${nx.col}">Tick when done</button>`:nx.col==="words"?tdWordModes(nx.t).map((m,i)=>`<button class="v2b ${i?"":"dark"}" data-tm="${nx.t.id}|${m}">${TMODES[m][0]}</button>`).join(""):(()=>{ const m=tdModes(nx.t).find(m=>TMODES[m][1]===nx.col); return `<button class="v2b dark" data-tm="${nx.t.id}|${m}">${TMODES[m][0]}</button>`; })()):"";

   <div class="trpage"><ul class="trpts">${pts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
   ${nx?`<div class="trins"><div><b>Next: ${esc(nx.t.n)} · ${colName(nx.col)}</b>${missed.length?`<span>Last time missed: ${esc(missed.slice(0,5).join(", "))}</span>`:""}</div><div class="trgo">${canWrite?startBtn:""}</div></div>`:`<div class="trins ok"><div><b>Every task is secure.</b><span>Keep it in mixed review.</span></div></div>`}
   <div class="trscroll"><div class="trgrid"><div class="h tn">Task</div>${TCOLS.map(([k,l])=>`<div class="h">${l}</div>`).join("")}
     ${ts.map(t=>`<div class="tn" title="${esc(tdWords(rid,t).map(w=>w.includes(":")?w.split(":")[0]:tdParse(w).word).join(", "))}"><b>${esc(t.n)}${t.type==="sl"?" 🎧":t.type==="exc"?" 🕵️":""}</b><small>${esc(t.ex||"")}</small></div>${TCOLS.map(([k])=>`<div>${cell(t,k)}</div>`).join("")}`).join("")}</div></div>
   <div class="trleg"><span><i class="s"></i>secure (${tdThr(c).thr}% on ${tdThr(c).need} days)</span><span><i class="p"></i>started</span><span><i class="nx"></i>next</span><span>Tap a box to practise it or tick it.</span></div>
   ${typeof wxRuleRow==="function"?wxRuleRow(rid):""}
   </div></div>`;
  o.querySelector("[data-wx]").onclick=()=>{ wkClose(); const y=scrollY; render(); scrollTo(0,y); };
  o.querySelectorAll("[data-wxr]").forEach(x=>x.onclick=()=>openWX(c,"r:"+rid,x.dataset.wxr));
  o.querySelectorAll("[data-tc]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const [tid,col]=b.dataset.tc.split("|"); const t=tdTask(rid,tid);
    if(col==="explain"||col==="own"){ trTick(tid,col); return; }
    if(col==="words"){ const ms=tdWordModes(t); if(ms.length===1) openTask(c,rid,tid,ms[0]); else { TR.pop=TR.pop===tid+"|words"?null:tid+"|words"; trDraw(); } return; }
    const m=tdModes(t).find(m=>TMODES[m][1]===col); if(m) openTask(c,rid,tid,m); });
  o.querySelectorAll("[data-tm]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const [tid,m]=b.dataset.tm.split("|"); TR.pop=null; openTask(c,rid,tid,m); });
  o.onclick=e=>{ if(TR&&TR.pop&&!e.target.closest(".trpop")){ TR.pop=null; trDraw(); } };

async function trTick(tid,col){ if(!canWrite) return; const {c,rid}=TR; const t=tdTask(rid,tid); const x=tdCell(c,rid,t,col);
  try{ await db.collection("okdrills").doc().set({clientId:c.id,date:today(),kind:"task",target:rid,task:tid,label:t.n,mode:"tick",step:col,on:!x.on,items:[],createdAt:Date.now()}); }catch(e){ toast(errMsg(e)); }
  setTimeout(()=>{ tdSyncLevel(c,rid); trDraw(); },150); }

/* ---------- activity runner ---------- */
let TA=null;
const SL_TEACH={s:"Short: a quick sound, like the a in cat.",l:"Long: the vowel says its name, like the a in cake."};
function openTask(c,rid,tid,mode){
  const t=tdTask(rid,tid); let items=[];
  const W=tdWords(rid,t), S=tdSents(rid,t);
  if(mode==="sl"||mode==="exc") items=gmShuffle(W).slice(0,12).map(x=>{ const [w,k]=x.split(":"); return {w,k}; });
  else if(mode==="choose"||mode==="read"||mode==="dict") items=gmShuffle(W).slice(0,10).map(x=>({...tdParse(x)}));
  else if(mode==="sent") items=gmShuffle(S).slice(0,4).map(s=>({...tdSent(s)}));
  else if(mode==="fix"){ const src=S.length>=6?gmShuffle(S).slice(0,8).map(s=>({...tdSent(s)})):gmShuffle(W).slice(0,8).map(w=>({plain:"",pre:"",t:tdParse(w),post:""}));
    items=gmShuffle(src.map((x,i)=>({...x,wrong:i%2===0&&x.t&&x.t.opts.length>1}))); }
  if(mode==="story"){ const ss=TD_STORY[rid]; const k=tdDrills(c,rid,"st").filter(d=>d.mode==="story").length%ss.length; return openStory(c,rid,t,ss[k],k); }
  TA={c,rid,t,mode,items,i:0,res:[],t0:Date.now()}; taReset();
  const o=document.getElementById("wkov"); if(o) o.classList.add("taon");
  taDraw();
}
function taReset(){ Object.assign(TA,{wrongs:[],miss:false,first:null,stage:null,opts:null,fb:null,spoke:false,lock:false}); }
function taTip(){ return TA.t.tip||(TD_PTS[TA.rid]||[])[0]||RULE_PLAIN[TA.rid]||""; }
function taDraw(){

    body=`<p class="wkq">${say(it.word)} Which spelling goes in the gap?</p><div class="wkbig">${esc(it.pre)}<span class="tagap">${fin?esc(it.ans):wr.length?`<s>${esc(wr[wr.length-1])}</s>`:"&nbsp;"}</span>${esc(it.post)}</div>

  else if(mode==="fix"){ const fixed=TA.stage==="ok"; const w=fixed?it.t.word:it.wrong?it.t.bad:it.t.word;

      :fixed?"":`<div class="wkopts"><button data-tf="ok" ${TA.lock?"disabled":""}>✓ Looks right</button><button data-tf="bad" ${TA.lock?"disabled":""}>✗ Fix it</button></div>`}${fb}`; }

  o.innerHTML=`<div class="wkin">${wkCrumb()}<div class="wkhd"><b>${esc(t.n)}${mode==="sl"||mode==="exc"?"":" · "+TMODES[mode][0]}</b><span>${done?"":`${i+1} of ${items.length}`}</span><button class="wkx" data-ta="back" aria-label="Back to the rule">✕</button></div>${bar}<div class="wkkid">${body}</div></div>`;

  o.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{ const ch=(o.querySelector("[data-tch]")||{}).value||null; taRec(it.word||it.plain,b.dataset.tr,ch); });

  o.querySelectorAll("[data-tfp]").forEach(b=>b.onclick=()=>taFixPick(b.dataset.tfp));
  o.querySelectorAll("[data-tsl]").forEach(b=>b.onclick=()=>taJudge(b.dataset.tsl));
  if(!done&&(mode==="choose"||mode==="sl")&&!TA.spoke){ TA.spoke=true; gmSay(it.word||it.w); }
}
function taNextSoon(p,ch){ TA.lock=true; taDraw(); setTimeout(()=>{ if(TA) taRec(p,TA.miss?"x":"a",TA.first||ch||null); },900); }
function taChoose(x){ const it=TA.items[TA.i];
  if(x===it.ans){ TA.stage="ok"; taNextSoon(it.word); }
  else { TA.wrongs.push(x); TA.miss=true; if(!TA.first) TA.first=x; taDraw(); } }
function taFix(said){ const it=TA.items[TA.i];
  if(said==="bad"&&it.wrong){ TA.stage="pick"; TA.opts=null; TA.fb=null; taDraw(); return; }
  if(said==="ok"&&!it.wrong){ TA.fb={ok:true,html:"Yes! That one's right."}; taNextSoon(it.t.word); return; }
  TA.miss=true; if(!TA.first) TA.first=said==="ok"?it.t.bad:"said wrong";
  TA.fb={ok:false,html:said==="ok"?`Look again. ${esc(taTip())}`:`Look again, it's spelled right. ${esc(taTip())}`}; taDraw(); }
function taFixPick(x){ const it=TA.items[TA.i];
  if(x===it.t.word){ TA.stage="ok"; TA.fb={ok:true,html:`Yes! <b>${esc(it.t.word)}</b>`}; taNextSoon(it.t.word,it.t.bad); }
  else { TA.wrongs.push(x); TA.miss=true; if(!TA.first) TA.first=x; TA.fb={ok:false,html:esc(taTip())}; taDraw(); } }
function taJudge(k){ const it=TA.items[TA.i];
  if(k===it.k){ TA.stage=k; TA.fb={ok:true,html:TA.mode==="sl"?(TA.miss?"Yes!":"Yes!"):"Good detective work!"}; if(TA.mode==="sl") gmSay(it.w); taNextSoon(it.w); }
  else { TA.wrongs.push(k); TA.miss=true; if(!TA.first) TA.first=(TA.t.lab&&TA.t.lab[k])||({s:"short",l:"long",r:"follows",x:"breaker"})[k];
    TA.fb={ok:false,html:TA.mode==="sl"?`Listen again. ${esc((TA.t.teach||SL_TEACH)[it.k]||"")}`:it.k==="x"?esc(TA.t.why||"This one breaks the rule."):`This one follows the rule. ${esc((TD_PTS[TA.rid]||[])[0]||"")}`};
    if(TA.mode==="sl") gmSay(it.w); taDraw(); } }
function taRec(p,r,ch){ TA.res.push({p,r,...(ch?{ch}:{})}); TA.i++; taReset(); if(TA.i>=TA.items.length) taSave(); taDraw(); }
function taAct(a){
  if(a==="again"){ openTask(TA.c,TA.rid,TA.t.id,TA.mode); return; }
  if(a==="back"){ const o=document.getElementById("wkov"); if(o) o.classList.remove("taon"); TA=null; trDraw(); }
}
async function taSave(){ if(!canWrite||TA.saved||!TA.res.length) return; const {c,rid,t,mode}=TA;
  try{ await db.collection("okdrills").doc().set({clientId:c.id,date:today(),kind:"task",target:rid,task:t.id,label:t.n,mode,items:TA.res,ms:Date.now()-TA.t0,createdAt:Date.now()}); TA.saved=true; }catch(e){ toast(errMsg(e)); }
  setTimeout(()=>{ tdSyncLevel(c,rid); if(TA) taDraw(); },200); }

/* ---------- detective stories ---------- */
function stTokens(x){ const out=[]; const re=/\{([^>}]+)>([^}]+)\}|([A-Za-z']+)|([^A-Za-z'{]+)/g; let m; while((m=re.exec(x))){ if(m[1]) out.push({w:m[1],right:m[2],bad:true}); else if(m[3]) out.push({w:m[3]}); else out.push({p:m[4]}); } out.forEach((t,i)=>t.i=i); return out; }
function openStory(c,rid,t,st,k){
  TA={c,rid,t,mode:"story",st,k,tok:stTokens(st.x),flags:new Set(),phase:"find",clues:0,fixQ:[],fi:0,res:[],items:[],i:0,t0:Date.now()}; taReset();
  const o=document.getElementById("wkov"); if(o) o.classList.add("taon"); stDraw(); }
function stDraw(){
  const o=document.getElementById("wkov"); if(!o||!TA) return; const S=TA; const bad=S.tok.filter(x=>x.bad);
  let body="";
  if(S.phase==="find"){
    body=`<p class="wkq">Find the ${bad.length} spelling mistakes 🕵️ Tap a word to mark it.</p>
      <div class="ststory">${S.tok.map(x=>x.p!==undefined?esc(x.p):`<span class="stw ${S.flags.has(x.i)?"fl":""} ${S.clue===x.i?"clue":""}" data-sw="${x.i}">${esc(x.w)}</span>`).join("")}</div>
      <p class="wkq">${S.flags.size} marked</p>
      <div class="wknav"><button data-st="clue">Give me a clue</button><button class="go" data-st="check">Check my case</button></div>`; }
  else if(S.phase==="check"){ const found=bad.filter(x=>S.flags.has(x.i)).length; const fa=S.tok.filter(x=>!x.bad&&S.flags.has(x.i)).length;
    body=`<p class="wkq">You found <b>${found} of ${bad.length}</b>${fa?` · ${fa} ${fa===1?"word was":"words were"} actually right`:""}${S.clues?` · ${S.clues} clue${S.clues>1?"s":""}`:""}</p>
      <div class="ststory">${S.tok.map(x=>x.p!==undefined?esc(x.p):`<span class="stw ${x.bad?(S.flags.has(x.i)?"hit":"miss"):S.flags.has(x.i)?"fa":""}">${esc(x.w)}</span>`).join("")}</div>
      <div class="stleg"><span class="hit">found</span><span class="miss">missed</span><span class="fa">was right</span></div>
      <div class="wknav"><button class="go" data-st="fix">Now fix them</button></div>`; }
  else if(S.phase==="fix"){ const x=S.fixQ[S.fi]; const ctx=stCtx(x);
    body=`<p class="wkq">Fix it ${S.fi+1} of ${S.fixQ.length}</p><div class="tasent">${ctx}</div>
      <div class="wkopts">${(S.opts=S.opts||gmShuffle([x.right,x.w])).map(w=>`<button data-sfx="${esc(w)}" class="${S.wrongs.includes(w)?"bad":S.stage==="ok"&&w===x.right?"good":""}" ${S.wrongs.includes(w)||S.lock?"disabled":""}>${esc(w)}</button>`).join("")}</div>
      ${S.fb?`<p class="wkfb ${S.fb.ok?"tagood":"tahint"}">${S.fb.html}</p>`:""}`; }
  else { const a=S.res.filter(r=>r.r==="a").length;
    body=`<div class="wkbig">${a} / ${S.res.length}</div><p class="wkq">Case closed: ${esc(S.st.t)}</p>${(()=>{ const pr=S.res.filter(r=>r.r==="x"&&r.ch!=="marked but right").map(r=>r.p), fa=S.res.filter(r=>r.ch==="marked but right").map(r=>r.p);
        return (pr.length?`<p class="wkfb">To practise: ${esc(pr.join(", "))}</p>`:`<p class="wkfb">Super sleuth! Every mistake found and fixed.</p>`)+(fa.length?`<p class="wkq">Marked but spelled right: ${esc(fa.join(", "))}</p>`:""); })()}
      <div class="wknav">${S.saved?`<span class="sub">Saved to the Activity log.</span>`:""}<button data-ta="back" class="go">Back to the rule</button></div>`; }
  o.innerHTML=`<div class="wkin">${wkCrumb()}<div class="wkhd"><b>🕵️ ${esc(S.st.t)}</b><span>Case ${S.k+1} of ${TD_STORY[S.rid].length}</span><button class="wkx" data-ta="back" aria-label="Back to the rule">✕</button></div><div class="wkkid">${body}</div></div>`;
  o.querySelectorAll("[data-ta]").forEach(b=>b.onclick=()=>taAct(b.dataset.ta));
  o.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.sw); S.flags.has(i)?S.flags.delete(i):S.flags.add(i); if(S.clue===i) S.clue=null; stDraw(); });
  o.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ const a=b.dataset.st;
    if(a==="clue"){ const left=bad.filter(x=>!S.flags.has(x.i)); if(left.length){ S.clue=left[0].i; S.clues++; } stDraw(); }
    if(a==="check"){ S.phase="check"; stDraw(); }
    if(a==="fix"){ S.fixQ=bad; S.fi=0; S.phase="fix"; Object.assign(S,{wrongs:[],opts:null,fb:null,stage:null,lock:false,miss:false}); stDraw(); } });
  o.querySelectorAll("[data-sfx]").forEach(b=>b.onclick=()=>{ const x=S.fixQ[S.fi]; const w=b.dataset.sfx;
    if(w===x.right){ S.stage="ok"; S.lock=true; S.fb={ok:true,html:`Yes! <b>${esc(x.right)}</b>`}; stDraw();
      setTimeout(()=>{ S.res.push({p:x.right,r:S.flags.has(x.i)&&!S.miss?"a":"x",ch:x.w}); S.fi++; Object.assign(S,{wrongs:[],opts:null,fb:null,stage:null,lock:false,miss:false});
        if(S.fi>=S.fixQ.length){ S.tok.filter(t=>!t.bad&&S.flags.has(t.i)).forEach(t=>S.res.push({p:t.w,r:"x",ch:"marked but right"})); S.phase="done"; stSave(); } stDraw(); },900); }
    else { S.wrongs.push(w); S.miss=true; S.fb={ok:false,html:esc(stTip())}; stDraw(); } });
}
const ST_TIP={r11:"q always has a u with it: qu.",r30:"Short vowel at the end? Double it: ff, ll, ss, zz.",r26:"ck right after one short vowel. Otherwise just k.",r29:"z at the start. s for /z/ in the middle or end.",rdm:"Short vowel: double it. Long vowel: one letter."};
function stTip(){ return ST_TIP[TA.rid]||TD_STIP[TA.rid]||(TD_PTS[TA.rid]||[])[0]||""; }
function stCtx(x){ const T=TA.tok; let a=x.i, b=x.i; while(a>0&&!(T[a-1].p&&/[.!?]/.test(T[a-1].p))) a--; while(b<T.length-1&&!(T[b].p&&/[.!?]/.test(T[b].p))) b++;
  return T.slice(a,b+1).map(t=>t.p!==undefined?esc(t.p):t.i===x.i?`<mark>${esc(t.w)}</mark>`:esc(t.bad?t.right:t.w)).join("").trim(); }
async function stSave(){ if(!canWrite||TA.saved) return; const {c,rid,t}=TA;
  try{ await db.collection("okdrills").doc().set({clientId:c.id,date:today(),kind:"task",target:rid,task:"st",label:`Detective story: ${TA.st.t}`,mode:"story",clues:TA.clues,items:TA.res,ms:Date.now()-TA.t0,createdAt:Date.now()}); TA.saved=true; }catch(e){ toast(errMsg(e)); }
  setTimeout(()=>{ tdSyncLevel(c,rid); if(TA&&TA.mode==="story") stDraw(); },200); }

const PCG={idle:"",correct:"✓",partial:"≈",wrong:"○"};

function openCheck(c,prog,num){
  let info; try{ info=SC.pcInfo(c.id); }catch(e){ toast("Still loading, try again in a moment."); return; }
  const rec=info.rec||{prog:"initial",check:1};
  prog=prog||rec.prog; num=num||rec.check;
  const k=info.list[prog].find(x=>x.check===num)||info.list[prog][0];
  PC={c,info,prog,num:k.check,k,d:today(),wr:k.word_reading.map(()=>"idle"),wd:k.word_dictation.map(()=>"idle"),sd:"idle",sdNote:"",notes:"",view:"log"};
  wkClose(); WK={c,kind:"check"};
  const o=document.createElement("div"); o.id="wkov"; o.className="wkov trov"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true");
  document.body.appendChild(o); document.body.style.overflow="hidden"; document.addEventListener("keydown",wkKey);

function pcGroupsN(items){ const g=[]; items.forEach((it,i)=>{ let l=g[g.length-1]; if(!l||l.unit!==it.unit){ l={unit:it.unit,ix:[]}; g.push(l); } l.ix.push(i); }); return g; }
function pcPct(arr){ let s=0,t=0; arr.forEach(x=>{ if(x==="idle") return; t++; if(x==="correct") s++; else if(x==="partial") s+=.5; }); return t?Math.round(s/t*100):null; }

function swPool(uid){ const set=gmSetFor(uid); if(!set) return []; const own=g2Words(set);
  if(own.length>=12) return own; const order=["icu1","icu2","icu3","icu4","icu5","icu6","icu7","ic1","ic8","ic9","ic3","ic4"]; const k=order.indexOf(uid);
  const prev=k>0?gmSets().filter(x=>x.code==="ic"&&order.indexOf(x.id)>=0&&order.indexOf(x.id)<k).flatMap(g2Words):[]; return own.concat(gmShuffle(prev).slice(0,12)); }

function swPick(f,n){ const uid=SWA.uid; const own=gmShuffle(swWords(uid).filter(f)); const rev=gmShuffle(swPool(uid).filter(f).filter(x=>!own.some(o=>o.w===x.w)));
  const k=Math.min(own.length,rev.length?n-2:n); return gmShuffle(own.slice(0,k).concat(rev.slice(0,n-k))); }

function swTargets(uid){ const set=gmSetFor(uid); if(!set) return {test:()=>false,label:""};
  if(set.code==="ec"){ const sps=set.sp; const inList=new Set(g2Words(set).map(x=>x.w.toLowerCase()).concat(SW_ALSO[set.id]||[]));
    const multi=sps.filter(sp=>sp.length>1&&!/[-_]/.test(sp)), split=sps.filter(sp=>/[-_]/.test(sp));
    return {label:sps.join(", "),test:w=>{ const w2=w.toLowerCase().replace(/[^a-z]/g,""); if(!w2) return false; if(inList.has(w2)) return true;
      if(split.some(sp=>new RegExp(sp[0]+"[^aeiou]"+sp.slice(-1)+"$").test(w2))) return true;
      if(set.id==="le") return multi.some(sp=>w2.endsWith(sp)); if(set.id==="silent") return multi.some(sp=>sp==="mb"?w2.includes("mb"):w2.startsWith(sp));
      return multi.some(sp=>/^[^aeiou]e$/.test(sp)?w2.endsWith(sp):w2.includes(sp)); }}; }
  if(IC_NEW[uid]){ const gs=IC_NEW[uid].split(" "); return {label:gs.join(", "),test:w=>gmSplit(w.toLowerCase()).some(p=>gs.includes(p))}; }
  const re={ic8:/[^aeiou][^aeiou]$/i,ic9:/^[^aeiou]{2}[aeiou]/i,ic3:/^[^aeiou]{2,3}[aeiou][^aeiou]*$/i,ic4:/sh|ch|th|ck|ng|qu|wh/i}[uid];
  return {label:{ic8:"two consonants at the end",ic9:"two consonants at the start",ic3:"three or more consonants",ic4:"sh, ch, th, ck, ng, qu, wh"}[uid]||"",test:w=>re?re.test(w.replace(/[^A-Za-z]/g,"")):false}; }
function swAvail(uid,k){ if(k.startsWith("wx")) return typeof wxAvail==="function"&&wxAvail("u:"+uid,k); const set=gmSetFor(uid); if(!set) return false; const sents=SW_SENT[set.id]||[];
  if(k==="swsent"||k==="swscram"||k==="swdict") return sents.length>0; if(k==="sw4row") return swPool(uid).length>=12; return swWords(uid).filter(swSimple).length>=4; }
function openSW(c,uid,k){ if(k.startsWith("wx")){ openWX(c,"u:"+uid,k); return; } const set=gmSetFor(uid); if(!set) return;
  wkClose(); WK={c,kind:"swa"}; SWA={c,uid,set,k,t0:Date.now(),items:[],i:0};
  const o=document.createElement("div"); o.id="wkov"; o.className="wkov"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true");
  document.body.appendChild(o); document.body.style.overflow="hidden"; document.addEventListener("keydown",wkKey);
  ({swsent:swSentInit,swtrack:swTrackInit,swsearch:swSearchInit,sw4row:sw4Init,swlines:swLinesInit,sworder:swOrderInit,swrcwc:swRcwcInit,swdict:swDictInit,swscram:swScramInit,swswap:()=>swSwapInit(),swspot:()=>swSpotInit()})[k](); swDraw(); }
function swDraw(){ const o=document.getElementById("wkov"); if(!o||!SWA) return; const meta=SW_ACTS.flatMap(x=>x[1]).find(x=>x[0]===SWA.k);
  const body=({swsent:swSent,swtrack:swTrack,swsearch:swSearch,sw4row:sw4,swlines:swLines,sworder:swOrder,swrcwc:swRcwc,swdict:swDict,swscram:swScram,swswap:()=>swSwap(),swspot:()=>swSpot()})[SWA.k]();
  const n=SWA.n||0;
  o.innerHTML=`<div class="wkin">${wkCrumb()}<div class="wkhd"><b>${meta[1]} ${meta[2]}</b><span>${esc(SWA.c.code)} · ${esc(SWA.set.label)}</span><button class="wkx" data-wx aria-label="Close">✕</button></div>
    ${n?`<div class="tabar">${[...Array(n)].map((_,k)=>{ const r=SWA.items[k]; return `<i class="${r?(r.r==="a"?"a":r.r==="c"?"c":"x"):k===SWA.i?"on":""}"></i>`; }).join("")}</div>`:""}<div class="wkkid">${body}</div></div>`;
  o.querySelector("[data-wx]").onclick=()=>{ const c=SWA.c,u=SWA.uid; wkClose(); SWA=null; openUnit(c,u); };
  o.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>swAct(b.dataset.sw,b.dataset.v));
  o.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>gmSay(b.dataset.say));
  const inp=o.querySelector("[data-swin]"); if(inp) inp.oninput=()=>{ SWA.typed=inp.value; }; }
async function swSave(){ if(!canWrite||SWA.saved||!SWA.items.length) return; SWA.saved=true; const a=SWA.items.filter(x=>x.r==="a").length;
  try{ await db.collection("games").doc().set({clientId:SWA.c.id,date:today(),game:SWA.k,set:SWA.set.id,label:SWA.set.label,correct:a,total:SWA.items.length,ms:Date.now()-SWA.t0,items:SWA.items,createdAt:Date.now()}); }catch(e){ toast(errMsg(e)); } }
const swEnd=line=>{ swSave(); const a=SWA.items.filter(x=>x.r==="a").length; return `<div class="wkbig">${SWA.items.length?`${a} / ${SWA.items.length}`:"🎉"}</div><p class="wkfb">${line}</p>${SWA.items.some(x=>x.r==="x")?`<p class="wkq">To practise: ${esc(SWA.items.filter(x=>x.r==="x").map(x=>x.w).join(", "))}</p>`:""}<div class="wknav"><button class="go" data-sw="again">Again</button></div>`; };
const swAdult=x=>`<div class="taadult"><span>For the adult</span>${x}</div>`;
const swSay=w=>`<button class="tasay" data-say="${esc(w)}" aria-label="Say it">🔊</button>`;
const swFb=()=>SWA.fb?`<p class="wkfb ${SWA.fb.ok?"tagood":"tahint"}">${SWA.fb.t}</p>`:"";

/* sentence reading */
function swSentInit(){ SWA.list=gmShuffle(SW_SENT[SWA.set.id]).slice(0,4); SWA.n=SWA.list.length; SWA.stage="read"; SWA.tap=new Set(); SWA.T=swTargets(SWA.uid); }
function swSent(){ if(SWA.i>=SWA.list.length) return swEnd("Great reading!");
  const s=SWA.list[SWA.i]; const toks=s.split(/(\s+)/);
  const words=toks.map((t,k)=>/\S/.test(t)?`<span class="swtw ${SWA.stage==="find"&&SWA.tap.has(k)?"on":""} ${SWA.stage==="check"?(SWA.T.test(t)?(SWA.tap.has(k)?"hit":"miss"):SWA.tap.has(k)?"fa":""):""}" ${SWA.stage==="find"?`data-sw="ttap" data-v="${k}"`:""}>${esc(t)}</span>`:t).join("");
  return `<div class="tasent swsent">${words}</div>
   ${SWA.stage==="read"?`<p class="wkq">Read the sentence.</p>${swAdult(`<div class="tarow"><button class="taok" data-sw="sr" data-v="a">✓ Read it</button><button class="tasl" data-sw="sr" data-v="c">Read it with help</button><button class="tax" data-sw="sr" data-v="x">✗ Not yet</button></div>`)}`
   :SWA.stage==="again"?`<p class="wkq">Now read it again, a bit quicker.</p><div class="wknav"><button class="go" data-sw="sagain">Done</button></div>`
   :SWA.stage==="find"?`<p class="wkq">Tap every word with <b>${esc(SWA.T.label)}</b>.</p><div class="wknav"><button class="go" data-sw="scheck">Check</button></div>`
   :`<div class="stleg"><span class="hit">found</span><span class="miss">missed</span><span class="fa">not this one</span></div><div class="wknav"><button class="go" data-sw="snext">Next sentence</button></div>`}`; }
/* tracking */
function swTrackInit(){ const ws=swPick(swSimple,6); const gs=swGraphs(SWA.uid);
  SWA.list=ws.map(x=>{ const parts=x.parts.map(p=>p.toLowerCase()); const len=16; const at=Math.floor(Math.random()*(len-parts.length)); const line=[];
    for(let k=0;k<len;k++){ if(k===at){ line.push(...parts); k+=parts.length-1; } else line.push(gs[Math.floor(Math.random()*gs.length)]); }
    // make sure the word only appears once
    for(let k=0;k<=line.length-parts.length;k++){ if(k!==at&&parts.every((p,j)=>line[k+j]===p)) line[k]=gs.find(g=>g!==parts[0])||"x"; }
    return {w:x.w,parts,line,at}; });
  SWA.n=SWA.list.length; SWA.a=null; SWA.fb=null; }
function swTrack(){ if(SWA.i>=SWA.list.length) return swEnd("Sharp eyes!");
  const x=SWA.list[SWA.i];
  return `<p class="wkq">Find <b class="swbig">${esc(x.w)}</b>. Tap its first letter, then its last.</p>
    <div class="swline">${x.line.map((g,k)=>`<button class="${SWA.a===k?"on":""} ${SWA.found&&k>=x.at&&k<x.at+x.parts.length?"hit":""}" data-sw="tk" data-v="${k}">${esc(g)}</button>`).join("")}</div>${swFb()}`; }
/* word search */
function swSearchInit(){ const ws=swPick(x=>swSimple(x)&&x.parts.length<=6,6); const gs=swGraphs(SWA.uid); const W=11;
  const rows=ws.map(x=>{ const parts=x.parts.map(p=>p.toLowerCase()); const at=Math.floor(Math.random()*(W-parts.length+1)); const r=[]; for(let k=0;k<W;k++) r.push(k>=at&&k<at+parts.length?parts[k-at]:gs[Math.floor(Math.random()*gs.length)]); return {r,w:x.w,at,len:parts.length}; });
  const extra=[...Array(2)].map(()=>({r:[...Array(W)].map(()=>gs[Math.floor(Math.random()*gs.length)]),w:null}));
  SWA.rows=gmShuffle(rows.concat(extra)); SWA.words=ws.map(x=>x.w); SWA.wkey=Object.fromEntries(ws.map(x=>[x.w,x.parts.join("").toLowerCase()])); SWA.hits=[]; SWA.found=new Set(); SWA.a=null; SWA.n=0; }
function swSearch(){ if(SWA.found.size>=SWA.words.length) return swEnd("You found them all!");
  return `<div class="swwords">${SWA.words.map(w=>`<span class="${SWA.found.has(w)?"on":""}">${esc(w)}</span>`).join("")}</div>
   <p class="wkq">Tap the first and last letter of a word${SWA.a?" · now tap the last letter in the same row":""}.</p>
   <div class="swgrid">${SWA.rows.map((row,ri)=>`<div class="swrow">${row.r.map((g,k)=>{ const f=(SWA.hits||[]).some(([r,lo,hi])=>r===ri&&k>=lo&&k<=hi); return `<button class="${f?"hit":""} ${SWA.a&&SWA.a[0]===ri&&SWA.a[1]===k?"on":""}" data-sw="sk" data-v="${ri}|${k}">${esc(g)}</button>`; }).join("")}</div>`).join("")}</div>${swFb()}`; }
/* four in a row */
function sw4Init(){ const ws=gmShuffle(swPool(SWA.uid)); const N=5; SWA.N=N; SWA.cells=[...Array(N*N)].map((_,k)=>({w:ws[k%ws.length].w,o:null})); SWA.turn="A"; SWA.sel=null; SWA.win=null; }
function sw4Win(){ const N=SWA.N, C=SWA.cells; const at=(r,c)=>r>=0&&c>=0&&r<N&&c<N?C[r*N+c].o:null;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){ const o=at(r,c); if(!o) continue; for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){ let k=1; while(k<4&&at(r+dr*k,c+dc*k)===o) k++; if(k>=4) return o; } }
  return C.every(x=>x.o)?"draw":null; }
function sw4(){ if(SWA.win){ swSave(); }
  const s=SWA.sel!==null?SWA.cells[SWA.sel]:null;
  return `<p class="wkq">${SWA.win?(SWA.win==="draw"?"It's a draw!":`<b>${SWA.win==="A"?"🔴 Player 1":"🔵 Player 2"}</b> wins! 🎉`):`<b>${SWA.turn==="A"?"🔴 Player 1":"🔵 Player 2"}</b>: pick a word, say the sounds and read it.`}</p>
   <div class="sw4">${SWA.cells.map((x,k)=>`<button class="${x.o?"o"+x.o:""} ${SWA.sel===k?"sel":""}" data-sw="fsel" data-v="${k}" ${x.o||SWA.win?"disabled":""}>${esc(x.w)}</button>`).join("")}</div>
   ${s&&!SWA.win?swAdult(`<b class="tw">${esc(s.w)}</b><div class="tarow"><button class="taok" data-sw="fok">✓ Read it</button><button class="tax" data-sw="fno">✗ Not yet</button></div>`):""}
   ${SWA.win?`<div class="wknav"><button class="go" data-sw="again">Play again</button></div>`:""}`; }
/* sound lines */
function swLinesInit(){ SWA.list=swPick(swSimple,8); SWA.n=SWA.list.length; swLinesItem(); }
function swLinesItem(){ const x=SWA.list[SWA.i]; if(!x) return; const gs=swGraphs(SWA.uid); const parts=x.parts.map(p=>p.toLowerCase());
  SWA.tray=gmShuffle([...new Set(parts.concat(gmShuffle(gs.filter(g=>!parts.includes(g))).slice(0,4)))]); SWA.fill=[]; SWA.miss=false; SWA.fb=null; setTimeout(()=>gmSay(x.w),250); }
function swLines(){ if(SWA.i>=SWA.list.length) return swEnd("Super spelling!");
  const x=SWA.list[SWA.i]; const n=x.parts.length;
  return `<p class="wkq">${swSay(x.w)} Say the sounds, then put a spelling on each line.</p>
   <div class="swlines">${[...Array(n)].map((_,k)=>`<span>${esc(SWA.fill[k]||"")}</span>`).join("")}</div>
   <div class="g2tray swtray">${SWA.tray.map(g=>`<button data-sw="lput" data-v="${esc(g)}" ${SWA.fill.length>=n?"disabled":""}>${esc(g)}</button>`).join("")}<button data-sw="lundo" ${SWA.fill.length?"":"disabled"}>↶</button></div>
   ${swFb()}${swAdult(`<b class="tw">${esc(x.w)}</b>`)}`; }
/* order the spellings */
function swOrderInit(){ SWA.list=swPick(x=>swSimple(x)&&x.parts.length>=3,8); SWA.n=SWA.list.length; swOrderItem(); }
function swOrderItem(){ const x=SWA.list[SWA.i]; if(!x) return; const p=x.parts.map(z=>z.toLowerCase()); let sh; let k=0; do{ sh=gmShuffle(p.map((g,j)=>({g,j}))); k++; }while(sh.every((o,j)=>o.g===p[j])&&k<20); SWA.tiles=sh; SWA.fill=[]; SWA.miss=false; SWA.fb=null; }
function swOrder(){ if(SWA.i>=SWA.list.length) return swEnd("Brilliant!");
  const x=SWA.list[SWA.i];
  return `<p class="wkq">Put the spellings in order to make a word.</p>
   <div class="swlines">${x.parts.map((_,k)=>`<span>${SWA.fill[k]!==undefined?esc(SWA.tiles[SWA.fill[k]].g):""}</span>`).join("")}</div>
   <div class="g2tray swtray">${SWA.tiles.map((t,k)=>`<button data-sw="oput" data-v="${k}" ${SWA.fill.includes(k)?"disabled":""}>${esc(t.g)}</button>`).join("")}<button data-sw="oundo" ${SWA.fill.length?"":"disabled"}>↶</button></div>
   ${swFb()}<div class="wknav"><button data-say="${esc(x.w)}">🔊 Hint</button></div>`; }
/* read, cover, write, check */
function swRcwcInit(){ SWA.list=swPick(()=>true,8); SWA.n=SWA.list.length; SWA.stage="read"; }
function swRcwc(){ if(SWA.i>=SWA.list.length) return swEnd("Read, covered, written and checked!");
  const x=SWA.list[SWA.i]; const st=SWA.stage;
  return `<div class="swcard ${st==="write"?"cov":""}">${st==="write"?"🙈":esc(x.w)}</div>
   ${st==="read"?`<p class="wkq">1. Say the sounds and read it.</p><div class="wknav"><button class="go" data-sw="rcov">2. Cover it</button></div>`
   :st==="write"?`<p class="wkq">3. Write it, saying the sounds as you go. Then read back what you wrote.</p><div class="wknav"><button class="go" data-sw="rchk">4. Check it</button></div>`
   :`<p class="wkq">4. Is it the same?</p>${swAdult(`<div class="tarow"><input data-swin placeholder="What they wrote (optional)" autocomplete="off" spellcheck="false"><button class="taok" data-sw="rres" data-v="a">✓ Same</button><button class="tax" data-sw="rres" data-v="x">✗ Different</button></div>`)}`}`; }
/* dictation */
function swDictInit(){ SWA.list=gmShuffle(SW_SENT[SWA.set.id]).slice(0,3); SWA.n=SWA.list.length; }
function swDict(){ if(SWA.i>=SWA.list.length) return swEnd("Great listening and writing!");
  const s=SWA.list[SWA.i];
  return `<p class="wkq">Listen, then write the sentence. Say the sounds as you write each word.</p><div class="wkbig tadict">${swSay(s)}</div>
   ${swAdult(`<b class="tw">${esc(s)}</b><div class="tarow"><input data-swin placeholder="Words they got wrong (optional)" autocomplete="off" spellcheck="false"><button class="taok" data-sw="dres" data-v="a">✓ All right</button><button class="tax" data-sw="dres" data-v="x">✗ Errors</button></div>`)}`; }
/* mixed-up sentences */
function swScramInit(){ SWA.list=gmShuffle(SW_SENT[SWA.set.id]).slice(0,4); SWA.n=SWA.list.length; swScramItem(); }
function swScramItem(){ const s=SWA.list[SWA.i]; if(!s) return; const w=s.split(/\s+/); let sh,k=0; do{ sh=gmShuffle(w.map((t,j)=>({t,j}))); k++; }while(sh.every((o,j)=>o.j===j)&&k<20); SWA.tiles=sh; SWA.fill=[]; SWA.miss=false; SWA.fb=null; SWA.done=false; }
function swScram(){ if(SWA.i>=SWA.list.length) return swEnd("Sentence superstar!");
  const s=SWA.list[SWA.i];
  return `<p class="wkq">${SWA.done?"Now read the whole sentence.":"Tap the words in order to make a sentence."}</p>
   <div class="swsline">${SWA.fill.map(k=>`<span>${esc(SWA.tiles[k].t)}</span>`).join("")||"&nbsp;"}</div>
   ${SWA.done?`<div class="wknav"><button class="go" data-sw="cnext">Next</button></div>`:`<div class="swwordtiles">${SWA.tiles.map((t,k)=>`<button data-sw="cput" data-v="${k}" ${SWA.fill.includes(k)?"disabled":""}>${esc(t.t)}</button>`).join("")}<button data-sw="cundo" ${SWA.fill.length?"":"disabled"}>↶</button></div>`}${swFb()}`; }

/* actions */
function swAct(a,v){ const S=SWA;
  if(a==="again"){ openSW(S.c,S.uid,S.k); return; }
  // sentence reading
  if(a==="sr"){ S.items.push({w:S.list[S.i],r:v}); S.i++; S.stage="read"; }
  if(a==="sagain"){ S.tap=new Set(); if(S.T.label) S.stage="find"; else { S.i++; S.stage="read"; } }
  if(a==="ttap"){ const k=Number(v); S.tap.has(k)?S.tap.delete(k):S.tap.add(k); }
  if(a==="scheck") S.stage="check";
  if(a==="snext"){ S.i++; S.stage="read"; S.tap=new Set(); }
  // tracking
  if(a==="tk"){ const x=S.list[S.i]; const k=Number(v); if(S.a===null){ S.a=k; S.fb=null; } else { const lo=Math.min(S.a,k), hi=Math.max(S.a,k); S.a=null;
      if(lo===x.at&&hi===x.at+x.parts.length-1){ S.found=true; S.items.push({w:x.w,r:S.miss?"x":"a"}); S.fb={ok:true,t:`Yes! <b>${esc(x.w)}</b>`}; swDraw(); setTimeout(()=>{ if(SWA===S){ S.i++; S.found=false; S.miss=false; S.fb=null; swDraw(); } },900); return; }
      S.miss=true; S.fb={ok:false,t:"Not quite. Look again from left to right."}; } }
  // word search
  if(a==="sk"){ const [ri,k]=v.split("|").map(Number); if(!S.a||S.a[0]!==ri){ S.a=[ri,k]; S.fb=null; } else { const row=S.rows[ri]; const lo=Math.min(S.a[1],k), hi=Math.max(S.a[1],k); S.a=null;
      const got=row.r.slice(lo,hi+1).join("").toLowerCase(), hitW=S.words.find(w=>!S.found.has(w)&&S.wkey[w]===got);
      if(hitW){ S.found.add(hitW); (S.hits=S.hits||[]).push([ri,lo,hi]); S.items.push({w:hitW,r:"a"}); S.fb={ok:true,t:`Found <b>${esc(hitW)}</b>! Say the sounds and read it.`}; gmSay(hitW); }
      else S.fb={ok:false,t:"Not a word on the list. Try again."}; } }
  // four in a row
  if(a==="fsel") S.sel=Number(v);
  if(a==="fok"||a==="fno"){ const x=S.cells[S.sel]; S.items.push({w:x.w,r:a==="fok"?"a":"x"}); if(a==="fok") x.o=S.turn; S.sel=null; S.win=sw4Win(); if(!S.win) S.turn=S.turn==="A"?"B":"A"; }
  // sound lines
  if(a==="lput"){ const x=S.list[S.i]; S.fill.push(v); if(S.fill.length===x.parts.length){ const ok=S.fill.join("")===x.parts.join("").toLowerCase();
      if(ok){ S.items.push({w:x.w,r:S.miss?"x":"a",...(S.first?{ch:S.first}:{})}); S.fb={ok:true,t:`Yes! <b>${esc(x.w)}</b>`}; swDraw(); setTimeout(()=>{ if(SWA===S){ S.i++; S.first=null; swLinesItem(); swDraw(); } },900); return; }
      S.miss=true; if(!S.first) S.first=S.fill.join(""); S.fb={ok:false,t:"Say the sounds again, slowly. Which line needs a different spelling?"}; gmSay(x.w); S.fill=[]; } }
  if(a==="lundo") S.fill.pop();
  // order
  if(a==="oput"){ const x=S.list[S.i]; S.fill.push(Number(v)); if(S.fill.length===x.parts.length){ const w=S.fill.map(k=>S.tiles[k].g).join(""); const ok=w===x.parts.join("").toLowerCase();
      if(ok){ S.items.push({w:x.w,r:S.miss?"x":"a"}); S.fb={ok:true,t:`Yes! <b>${esc(x.w)}</b>. Now read it.`}; gmSay(x.w); swDraw(); setTimeout(()=>{ if(SWA===S){ S.i++; swOrderItem(); swDraw(); } },1100); return; }
      S.miss=true; S.fb={ok:false,t:`<b>${esc(w)}</b> isn't it. Try a different order.`}; S.fill=[]; } }
  if(a==="oundo") S.fill.pop();
  // read cover write check
  if(a==="rcov") S.stage="write"; if(a==="rchk") S.stage="check";
  if(a==="rres"){ S.items.push({w:S.list[S.i].w,r:v,...(S.typed?{ch:S.typed}:{})}); S.typed=""; S.i++; S.stage="read"; }
  // dictation
  if(a==="dres"){ S.items.push({w:S.list[S.i],r:v,...(S.typed?{ch:S.typed}:{})}); S.typed=""; S.i++; }
  // scramble
  if(a==="cput"){ const s=S.list[S.i].split(/\s+/); S.fill.push(Number(v)); const k=S.fill.length-1;
      if(S.tiles[S.fill[k]].t!==s[k]){ S.fill.pop(); S.miss=true; S.fb={ok:false,t:"Hmm, read what you have so far. What comes next?"}; }
      else { S.fb=null; if(S.fill.length===s.length){ S.done=true; S.items.push({w:S.list[S.i],r:S.miss?"x":"a"}); } } }
  if(a==="cundo"){ S.fill.pop(); }
  if(a==="cnext"){ S.i++; swScramItem(); }
  swDraw(); }

function g2LadderInit(){ const L=gmShuffle(g2Ladders(G2.uid))[0]; G2.chain=L.w.split(" "); G2.i=1; G2.cur=G2.chain[0]; G2.pick=null; G2.miss=false;

/* ---- bingo ---- */
function g2Pool(){ const s=G2.set; const order=["icu1","icu2","icu3","icu4","icu5","icu6","icu7","ic1","ic8","ic9","ic3","ic4"];
  if(s.code==="ec") return gmSets().filter(x=>x.code==="ec").flatMap(g2Words);
  const k=order.indexOf(G2.uid); return gmSets().filter(x=>x.code==="ic"&&(k<0||order.indexOf(x.id)<=k)).flatMap(g2Words); }
function g2BingoInit(){ const s=G2.set; const pool=g2Pool(); let tiles;
  if(s.code==="ec"){ const own=s.sp.slice(); const others=[...new Set(pool.map(x=>x.sp).filter(x=>x&&!own.includes(x)))];
    tiles=gmShuffle(own.concat(gmShuffle(others).slice(0,9-own.length))).slice(0,9); G2.mode="spelling"; }
  else { const firsts=[...new Set(pool.map(x=>x.parts[0]))]; tiles=gmShuffle(firsts).slice(0,9); G2.mode="first"; }
  G2.tiles=tiles; G2.pool=pool; G2.marked=new Set(); G2.calls=[]; G2.bingo=false; g2BingoCall(); }
function g2BingoCall(){ const key=x=>G2.mode==="spelling"?x.sp:x.parts[0];
