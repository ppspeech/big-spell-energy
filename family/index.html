<style>
:root{--k:#1E2226;--m:#5B6570;--l:#D7DBD9;--g:#2F6B66;--gs:#DCE9E7;--y:#A07A35;--ys:#F1E8D6;--r:#8A2B3D;--rs:#F2E1E4;--bg:#FFFDF7;--card:#fff}
@media (prefers-color-scheme:dark){:root{--k:#ECEEEC;--m:#A7AEB4;--l:#3A4048;--bg:#181B1E;--card:#22262A;--gs:#1F3533;--ys:#3A3222;--rs:#3A2229;--g:#7FC4BC;--y:#D9AE5F;--r:#E38FA0}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--k);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:1.6rem;line-height:1.1}.top small{display:block;font-size:.85rem;color:var(--m);font-weight:400}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--l);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem}
.btn.g{background:var(--g);color:#fff;border-color:var(--g)}
.lv{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin:14px 0}
@media (max-width:760px){.lv{grid-template-columns:repeat(6,minmax(0,1fr))}}
.lv button{background:var(--card);border:1px solid var(--l);border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.lv button small{font-size:.68rem;color:var(--m);font-weight:700}
.lv button[aria-pressed="true"]{border:2px solid var(--g);background:var(--gs)}
.lv .st{position:absolute;top:-6px;right:-4px;font-size:.62rem;background:var(--ys);color:var(--y);border-radius:999px;padding:0 5px;font-weight:700}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:14px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr)}.par{order:2}}
.par{background:var(--gs);border-radius:18px;padding:14px 16px;font-size:.95rem}
.par h2{margin:0 0 6px;font-size:1.05rem;color:var(--g);display:flex;align-items:center;gap:8px}
.par p{margin:0 0 8px}.par p:last-child{margin:0}
.par .key{background:var(--card);border-radius:12px;padding:8px 10px;font-size:.88rem}
.card{background:var(--card);border:1px solid var(--l);border-radius:24px;padding:22px 18px 18px;text-align:center;position:relative;box-shadow:0 6px 22px rgba(0,0,0,.05)}
.card .n{position:absolute;top:14px;left:18px;color:var(--m);font-weight:700;font-size:.85rem}
.q{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800;line-height:1.25;margin:18px 0 6px;text-wrap:balance}
.q u{text-decoration-thickness:3px;text-underline-offset:4px}
.ans{display:inline-block;margin:8px 0 4px;padding:8px 18px;border-radius:999px;background:var(--ys);color:var(--y);font-weight:800;border:0;font-size:1rem}
.stars{font-size:1.4rem;letter-spacing:2px;margin:10px 0 14px;min-height:1.6em}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:0;border-radius:16px;padding:13px 4px;font-weight:800;font-size:.98rem;line-height:1.2}
.rate button small{display:block;font-weight:400;font-size:.75rem;opacity:.8}
.rate .x{background:var(--rs)}.rate .s{background:var(--ys)}.rate .f{background:var(--gs)}
.rate button:active{transform:scale(.97)}
.fin h2{margin:6px 0;font-size:1.6rem}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:14px;font-size:.85rem;color:var(--m)}
.panel{background:var(--card);border:1px solid var(--l);border-radius:18px;padding:14px 16px;margin-top:14px}
.panel h3{margin:0 0 8px;font-size:1rem}
.panel label{display:block;font-size:.85rem;font-weight:700;margin-bottom:4px}
.panel input{width:100%;max-width:280px;padding:8px 10px;border:1px solid var(--l);border-radius:10px;background:var(--bg);color:var(--k);font:inherit}
.panel .hint{font-size:.8rem;color:var(--m);margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--k);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:99}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{40%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style>

  ['Say octopus without oc.','topus'],['Say butterfly without but.','terfly'],['Say hamburger without ham.','burger'],['Say spaghetti without spa.','ghetti'],['Say koala without ko.','ala'],['Say volcano without vol.','cano']]},
 {id:'E3',skill:'saying a longer word without its first beat (trickier words)',how:'Say it slowly in beats first if it helps, then leave the first beat off.',items:[
  ['Say crocodile without croc.','odile'],['Say elephant without el.','ephant'],['Say telephone without tel.','ephone'],['Say tricycle without tri.','cycle'],['Say lemonade without lem.','onade'],['Say kookaburra without kook.','aburra'],
  ['Say avocado without av.','ocado'],['Say yesterday without yes.','terday'],['Say family without fam.','ily'],['Say holiday without hol.','iday'],['Say vegetable without veg.','etable'],['Say Saturday without Sat.','urday']]},
 {id:'F',skill:'taking away the first sound in a word',how:'Say the word, then say it without the first sound. Listen for sounds, not letters.',items:[
  ['Say meat without the /m/.','eat'],['Say coat without the /k/.','oat'],['Say gold without the /g/.','old'],['Say sit without the /s/.','it'],['Say nice without the /n/.','ice'],['Say lamp without the /l/.','amp'],
  ['Say bark without the /b/.','ark'],['Say farm without the /f/.','arm'],['Say seal without the /s/.','eel'],['Say bend without the /b/.','end'],['Say take without the /t/.','ache'],['Say fan without the /f/.','an']]},
 {id:'G',skill:'swapping the first sound to make a new word',how:'Say the word, swap the first sound, and say the new word.',items:[
  ['Say sun. Change /s/ to /f/.','fun'],['Say cat. Change /k/ to /h/.','hat'],['Say dog. Change /d/ to /l/.','log'],['Say bed. Change /b/ to /r/.','red'],['Say fish. Change /f/ to /d/.','dish'],['Say house. Change /h/ to /m/.','mouse'],
  ['Say pig. Change /p/ to /w/.','wig'],['Say mat. Change /m/ to /b/.','bat'],['Say car. Change /k/ to /j/.','jar'],['Say top. Change /t/ to /h/.','hop'],['Say boat. Change /b/ to /g/.','goat'],['Say fox. Change /f/ to /b/.','box']]},
 {id:'H',skill:'pulling the first sound off a sound cluster (blend)',how:'Stretch the start of the word so you can hear both sounds, then leave the first one off.',items:[
  ['Say snail without the /s/.','nail'],['Say stop without the /s/.','top'],['Say play without the /p/.','lay'],['Say price without the /p/.','rice'],['Say bring without the /b/.','ring'],['Say clock without the /k/.','lock'],
  ['Say train without the /t/.','rain'],['Say spot without the /s/.','pot'],['Say grow without the /g/.','row'],['Say blink without the /b/.','link'],['Say slip. Change /s/ to /f/.','flip'],['Say play. Change /p/ to /k/.','clay']]},
 {id:'I',skill:'taking away the last sound in a word',how:'Say the word, then say it again and stop before the last sound.',items:[
  ['Say seat without the /t/.','sea'],['Say cart without the /t/.','car'],['Say nose without the /z/.','no'],['Say tight without the /t/.','tie'],['Say plate without the /t/.','play'],['Say soap without the /p/.','sew'],
  ['Say bike without the /k/.','buy'],['Say moon without the /n/.','moo'],['Say tent without the /t/.','ten'],['Say farm without the /m/.','far'],['Say wheat without the /t/.','wee'],['Say rope without the /p/.','row']]},
 {id:'J',skill:'swapping the middle vowel sound to make a new word',how:'Say the word slowly and listen for the middle sound, then swap it.',items:[
  ['Say pat. Change /a/ to /i/.','pit'],['Say hot. Change /o/ to /a/.','hat'],['Say bed. Change /e/ to /a/.','bad'],['Say big. Change /i/ to /a/.','bag'],['Say ten. Change /e/ to /i/.','tin'],['Say hop. Change /o/ to /i/.','hip'],
  ['Say mud. Change /u/ to /a/.','mad'],['Say pen. Change /e/ to /a/.','pan'],['Say sock. Change /o/ to /a/.','sack'],['Say fun. Change /u/ to /a/.','fan'],['Say log. Change /o/ to /e/.','leg'],['Say pin. Change /i/ to /e/.','pen']]},
 {id:'K',skill:'pulling out the second sound of a cluster (blend)',how:'Stretch the start of the word so you can hear both sounds, then leave out the second one.',items:[
  ['Say glow without the /l/.','go'],['Say play without the /l/.','pay'],['Say smell without the /m/.','sell'],['Say spin without the /p/.','sin'],['Say stack without the /t/.','sack'],['Say black without the /l/.','back'],
  ['Say brag without the /r/.','bag'],['Say crab without the /r/.','cab'],['Say slow without the /l/.','sew'],['Say clap without the /l/.','cap'],['Say blue without the /l/.','boo'],['Say swing without the /w/.','sing']]},
 {id:'L',skill:'swapping the last sound to make a new word',how:'Say the word, swap the last sound, and say the new word.',items:[
  ['Say pig. Change /g/ to /n/.','pin'],['Say bed. Change /d/ to /l/.','bell'],['Say dog. Change /g/ to /t/.','dot'],['Say cup. Change /p/ to /t/.','cut'],['Say man. Change /n/ to /p/.','map'],['Say bat. Change /t/ to /g/.','bag'],
  ['Say hop. Change /p/ to /t/.','hot'],['Say ham. Change /m/ to /t/.','hat'],['Say rug. Change /g/ to /n/.','run'],['Say web. Change /b/ to /t/.','wet'],['Say sun. Change /n/ to /b/.','sub'],['Say cat. Change /t/ to /p/.','cap']]},
 {id:'M',skill:'hearing sounds tucked inside end clusters',how:'Say the word very slowly so you can hear every sound, then leave the tucked-in sound out.',items:[
  ['Say bend without the /n/.','bed'],['Say band without the /n/.','bad'],['Say desk without the /s/.','deck'],['Say lift without the /f/.','lit'],['Say past without the /s/.','pat'],['Say risk without the /s/.','rick'],
  ['Say pink without the /ng/.','pick'],['Say sink without the /ng/.','sick'],['Say camp without the /m/.','cap'],['Say lamp without the /m/.','lap'],['Say west without the /s/.','wet'],['Say list without the /s/.','lit']]}
];

const icon=(i,px)=>`<svg width="${px}" height="${px}" viewBox="0 0 64 64" role="img" aria-label="${ANIMALS[i][0]}">${ANIMALS[i][1]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ST={name:'',log:[],games:{}};
try{Object.assign(ST,JSON.parse(localStorage.getItem('bse-family')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('bse-family',JSON.stringify(ST))}catch(e){}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const V={li:null,deck:[],i:0,res:[],show:false,fin:false,setup:false};
const L=()=>LEVELS[V.li];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newDeck(){V.deck=shuffle(L().items).slice(0,10);V.i=0;V.res=[];V.show=false;V.fin=false}
function readHash(){const m=decodeURIComponent(location.hash.slice(1)).match(/^([A-Z][0-9]?)(?:&n=(.*))?$/);if(!m)return;const i=LEVELS.findIndex(l=>l.id===m[1]);if(i>=0){V.li=i;if(m[2]&&!ST.name){ST.name=m[2].slice(0,20);save()}}}
function pick(i){V.li=i;newDeck();history.replaceState(null,'','#'+L().id);render()}
function levelStars(id){return ST.log.filter(x=>x.l===id&&x.r==='f').length}
function weekStars(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));d.setHours(0,0,0,0);return ST.log.filter(x=>new Date(x.d+'T12:00')>=d&&x.r==='f').length}
function render(){
  const app=document.getElementById('app');
  let h=`<div class="top">${icon(V.li??4,48)}<h1>My Sound Adventure<small>Big Spell Energy · practice at home${ST.name?' · '+esc(ST.name):''}</small></h1>
   <div class="sp"><b>⚡ ${weekStars()} this week</b>${V.li!=null?`<button class="btn" data-a="games">🎮 Games</button>`:''}<button class="btn g" data-a="share">📤 Send to my speechie</button></div></div>`;
  h+=`<div class="lv" role="group" aria-label="Level">${LEVELS.map((l,i)=>{const s=levelStars(l.id);return `<button data-a="lv" data-i="${i}" aria-pressed="${i===V.li}" title="Level ${i+1}: ${ANIMALS[i][0]}">${s?`<span class="st">⚡${s}</span>`:''}${icon(i,34)}<small>${i+1}</small></button>`}).join('')}</div>`;
  if(V.li==null){h+=`<div class="card" style="padding:40px 20px"><div style="font-size:64px">👆</div><p style="font-size:1.15rem;margin:8px 0 0">Pick the level your speech pathologist gave you.</p></div>`}
  else{const lv=L();
    h+=`<div class="main"><div class="par"><h2>${icon(V.li,30)} Level ${V.li+1} · ${ANIMALS[V.li][0]}</h2><p>This level practises <b>${esc(lv.skill)}</b>.</p><p>${esc(lv.how)}</p>
      <div class="key"><b>Marking:</b> ⚡ <b>Quick!</b> = right in under 2 seconds · ✓ <b>Right but slow</b> · ✗ <b>Not yet</b> = wrong or needed help. Quick answers are the goal, so keep it fun and fast.</div></div><div class="card">`;
    if(V.fin){const c=k=>V.res.filter(x=>x===k).length;
      h+=`<div class="fin"><div style="font-size:84px">🏆</div><h2>${c('f')} quick ⚡ out of ${V.res.length}!</h2><div class="stars">${V.res.map(r=>r==='f'?'⚡':r==='s'?'✓':'·').join(' ')}</div><p>${c('f')} quick · ${c('s')} right but slow · ${c('x')} not yet</p><button class="btn g" data-a="again">Play again</button></div>`}
    else{const [q,a]=V.deck[V.i];
      h+=`<span class="n">${V.i+1} of ${V.deck.length}</span><div class="q">${esc(q).replace(/^Say (\S+?)(?=[ .,])/,'Say <u>$1</u>')}</div>
        ${V.show?`<div class="ans pop">${esc(a)}</div>`:`<button class="ans" data-a="reveal">Tap to see the answer</button>`}
        <div class="stars">${V.deck.map((_,j)=>V.res[j]==='f'?'⚡':V.res[j]==='s'?'✓':V.res[j]==='x'?'✗':'☆').join('')}</div>
        <div class="rate"><button class="x" data-a="rate" data-v="x">✗ Not yet</button><button class="s" data-a="rate" data-v="s">✓ Right<small>but slow</small></button><button class="f" data-a="rate" data-v="f">⚡ Quick!<small>under 2 seconds</small></button></div>`}
    h+=`</div></div>`;
  }
  h+=`<div class="foot"><span>Practice stays on this device until you send it.</span><button class="btn" data-a="setup">${V.setup?'Close':'⚙︎ For speech pathologists'}</button></div>`;
  if(V.setup)h+=`<div class="panel"><h3>Set up a link for a family</h3><label for="nm">Child's first name or initials (optional)</label><input id="nm" maxlength="20" value="${esc(ST.name)}" placeholder="e.g. Sam or S.T.">
    <p class="hint">Pick the level above, then copy the link. It opens straight onto that level. Practice items are fresh examples, not the PAST test items.</p>
    <div style="margin-top:10px"><button class="btn g" data-a="copy" ${V.li==null?'disabled':''}>📋 Copy link for family</button></div></div>`;
  app.innerHTML=h;
}
function summary(){
  const since=new Date();since.setDate(since.getDate()-13);const s0=since.toISOString().slice(0,10);
  const Lg=ST.log.filter(x=>x.d>=s0);if(!Lg.length)return null;
  const days=[...new Set(Lg.map(x=>x.d))].sort();const fmt=d=>new Date(d+'T12:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
  let t=`Big Spell Energy home practice${ST.name?' – '+ST.name:''}\n${fmt(days[0])} to ${fmt(days[days.length-1])}: practised on ${days.length} day${days.length>1?'s':''} (${days.map(fmt).join(', ')})\n`;
  const by={};Lg.forEach(x=>(by[x.l]=by[x.l]||[]).push(x));
  Object.entries(by).forEach(([id,arr])=>{const i=LEVELS.findIndex(l=>l.id===id);const c=r=>arr.filter(x=>x.r===r).length;
    const miss={};arr.filter(x=>x.r!=='f').forEach(x=>miss[x.q]=(miss[x.q]||0)+1);const tk=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([q])=>q);
    t+=`\nLevel ${i+1} ${ANIMALS[i][0]} (${id}): ${arr.length} tries\n  Quick ${c('f')} · Right but slow ${c('s')} · Not yet ${c('x')}`+(tk.length?`\n  Still tricky: ${tk.join(' | ')}`:'')+'\n'});
  return t;
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
async function share(){const t=summary();if(!t){toast('No practice yet in the last 2 weeks.');return}
  if(navigator.share){try{await navigator.share({title:'Home practice',text:t});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(t);toast('Copied. Paste it into a text or email to your speechie.')}catch(e){location.href='mailto:?subject='+encodeURIComponent('Home practice')+'&body='+encodeURIComponent(t)}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.closest('.sgk'))return;const a=b.dataset.a;
  if(a==='lv')pick(+b.dataset.i);
  if(a==='reveal'){V.show=true;render()}
  if(a==='rate'){const [q]=V.deck[V.i];V.res[V.i]=b.dataset.v;ST.log.push({d:today(),l:L().id,q,r:b.dataset.v});if(ST.log.length>3000)ST.log=ST.log.slice(-3000);save();V.i++;V.show=false;if(V.i>=V.deck.length)V.fin=true;render()}
  if(a==='again'){newDeck();render()}
  if(a==='share')share();
  if(a==='setup'){V.setup=!V.setup;render()}
  if(a==='copy'){const n=(document.getElementById('nm')?.value||'').trim().slice(0,20);ST.name=n;save();const url=location.origin+location.pathname+'#'+L().id+(n?'&n='+encodeURIComponent(n):'');
    try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){prompt('Copy this link:',url)}render()}
  if(a==='games'){if(!window.SpeechGames){toast('Games are still loading.');return}const lv=L();
    SpeechGames.open({items:lv.items.map(([q])=>({key:q,text:q})),who:ST.name.split(' ')[0],title:'Level '+(V.li+1)+' '+ANIMALS[V.li][0],state:ST.games||{},
      onSave:st=>{ST.games=st;save()},onFinish:res=>{(res||[]).forEach(r=>ST.log.push({d:today(),l:lv.id,q:r.key,r:r.k==='clear'?'f':r.k==='near'?'s':'x'}));save();render()}})}
});
window.addEventListener('hashchange',()=>{readHash();if(V.li!=null)newDeck();render()});
readHash();if(V.li!=null)newDeck();
render();
</script>
